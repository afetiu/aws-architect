<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Living Sim: Queue — Futureproof LAB</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* ---------- chapter strip ---------- */
  .chapters { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chapters::-webkit-scrollbar { display: none; }
  .chapters .chip { flex: none; white-space: nowrap; min-height: 36px; }
  .chapters .chip i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.14); display: inline-block; }
  .chapters .chip.done i { background: var(--ok); box-shadow: 0 0 8px var(--ok-glow); }
  .chapters .chip.on i { background: var(--accent); }
  .chapters .chip.on.done i { background: var(--ok); }

  /* ---------- goal card ---------- */
  .goal { position: relative; overflow: hidden; transition: box-shadow .4s; }
  .goal .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .goal h2 { margin-bottom: 4px; }
  .goal p { font-size: 14px; }
  .goal .grow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .goal .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .goal .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform-origin: left; transition: width .35s var(--ease-out), background .3s; }
  .goal.done .bar i { background: linear-gradient(90deg, var(--ok), #8af0b0); }
  .goal .prog { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .goal .lesson { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.25); font-size: 14px; }
  .goal .lesson b { color: var(--ok); font-family: var(--display); font-weight: 600; flex: 1; }
  .goal.done .lesson { display: flex; animation: popin .5s var(--spring) both; }
  .goal.done { box-shadow: 0 0 0 1px rgba(74,222,128,0.35), 0 0 40px -10px var(--ok-glow); }

  /* ---------- scene ---------- */
  .scene { position: relative; overflow: hidden; margin-top: 12px; }
  .scene-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0 14px; min-height: 44px; }
  .scene-bar .status { flex: 1; font-size: 12px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-bar .status b { color: var(--ink-2); font-weight: 500; }
  .tbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--ink-2); flex: none; transition: transform .3s var(--spring), background .2s, color .2s, border-color .2s; }
  .tbtn:active { transform: scale(.92); }
  .tbtn.on { color: var(--accent-2); border-color: var(--accent-glow); background: rgba(255,138,61,0.12); }
  .tbtn.speed { width: auto; padding: 0 12px; font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .stage { position: relative; height: clamp(330px, 84vw, 430px); }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .send {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 82px; height: 82px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb07a, var(--accent) 60%, #d9681f);
    color: #1a0d04; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em;
    box-shadow: 0 10px 30px -8px var(--accent-glow), 0 0 0 1px rgba(255,255,255,0.12) inset;
    transition: transform .25s var(--spring), box-shadow .2s; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .send:active, .send.hit { transform: translateY(-50%) scale(.9); box-shadow: 0 4px 14px -6px var(--accent-glow); }
  .send span { display: block; font-family: var(--body); font-weight: 500; font-size: 10px; letter-spacing: .02em; opacity: .75; }
  .send.pulse { animation: pulse-ring 1.6s var(--ease-out) infinite; }
  .send[disabled] { opacity: .35; pointer-events: none; }
  .send2 { position: absolute; left: 14px; top: calc(50% + 52px); width: 82px; min-height: 34px; border-radius: 10px; font-size: 12px; font-weight: 600; background: rgba(22,27,37,0.9); border: 1px solid var(--line-strong); color: var(--ink); transition: transform .3s var(--spring); display: none; }
  .send2.show { display: inline-flex; align-items: center; justify-content: center; }
  .send2:active { transform: scale(.94); }
  .send2.poison { color: var(--bad); border-color: rgba(255,107,107,0.4); }
  @media (min-width: 700px) { .send { left: 22px; width: 96px; height: 96px; font-size: 16px; } .send2 { left: 22px; width: 96px; top: calc(50% + 60px); } }

  /* ---------- stats ---------- */
  .stats { margin-top: 12px; }
  .stats .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .stats .stat .k { font-size: 10px; }
  .stats .stat .v { font-size: 22px; }
  .stats .spark { margin-top: 12px; position: relative; }
  .stats .spark canvas { display: block; width: 100%; height: 44px; }
  .stats .spark .k { position: absolute; left: 0; top: -2px; }
  @media (min-width: 700px) { .stats .grid { grid-template-columns: repeat(6, 1fr); } .stats .stat .v { font-size: 26px; } }

  /* ---------- knobs ---------- */
  .knobs { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .knobs .row { min-height: 44px; display: none; }
  .knobs .row.show { display: flex; }
  .knobs .row input[type=range] { flex: 1.3; }
  .knobs .row > label { flex: 1; }
  .knobs .actions { display: none; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
  .knobs .actions.show { display: flex; }
  .knobs .toggle { display: none; justify-content: space-between; min-height: 44px; }
  .knobs .toggle.show { display: flex; }
  .knobs .toggle span.l { flex: 1; font-size: 13px; color: var(--ink-2); }
  .knobs .toggle .val { font-family: var(--mono); font-size: 13px; margin-right: 10px; }
  .knobs .empty { font-size: 13px; color: var(--ink-dim); padding: 4px 0; }
  .facts { margin-top: 12px; font-size: 12.5px; color: var(--ink-dim); line-height: 1.6; }
  .facts b { color: var(--ink-2); font-family: var(--mono); font-weight: 600; }
  .btn.ok { border-color: rgba(74,222,128,0.4); color: var(--ok); }
</style>
</head>
<body>
<main class="wrap">
  <nav class="chapters chips rise" id="chapters" aria-label="Chapters"></nav>

  <section class="panel pad goal rise d1" id="goal">
    <div class="eyebrow" id="g-eyebrow">Chapter 1 of 7</div>
    <h2 id="g-title">No queue</h2>
    <p id="g-text"></p>
    <div class="grow">
      <div class="bar"><i id="g-bar"></i></div>
      <span class="prog" id="g-prog"></span>
      <button class="btn sm ghost" id="g-why">Why?</button>
    </div>
    <div class="lesson"><b id="g-lesson"></b><button class="btn sm primary" id="g-next">Next</button></div>
  </section>

  <section class="panel scene rise d2" id="scene">
    <div class="scene-bar">
      <div class="status" id="status"></div>
      <button class="tbtn" id="t-pause" aria-label="Pause / play" aria-pressed="false">
        <svg id="ic-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg id="ic-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4.5v15l12-7.5z"/></svg>
      </button>
      <button class="tbtn speed" id="t-speed" aria-label="Simulation speed">1×</button>
      <button class="tbtn" id="t-reset" aria-label="Reset chapter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div class="stage">
      <canvas id="cv"></canvas>
      <button class="send" id="send" aria-label="Send a message">SEND<span>tap fast</span></button>
      <button class="send2" id="send2"></button>
    </div>
  </section>

  <section class="panel pad stats rise d3">
    <div class="grid">
      <div class="stat"><span class="k">Queue depth</span><span class="v flow" id="s-depth">0</span></div>
      <div class="stat"><span class="k">In flight</span><span class="v" id="s-inflight">0</span></div>
      <div class="stat"><span class="k">Processed / s</span><span class="v ok" id="s-rate">0.0</span></div>
      <div class="stat"><span class="k" id="s-dup-k">Duplicates</span><span class="v warn" id="s-dup">0</span></div>
      <div class="stat"><span class="k" id="s-dlq-k">DLQ</span><span class="v bad" id="s-dlq">0</span></div>
      <div class="stat"><span class="k">Oldest msg</span><span class="v" id="s-age">0.0 s</span></div>
    </div>
    <div class="spark"><span class="k">Queue depth · last 30 s</span><canvas id="spark"></canvas></div>
  </section>

  <section class="panel pad knobs rise d4" id="knobs">
    <div class="row" data-k="rate"><label>Auto-send</label><input type="range" id="k-rate" min="0" max="20" step="1" value="0"><span class="val" id="v-rate">off</span></div>
    <div class="row" data-k="consumers"><label>Lambda consumers</label><input type="range" id="k-consumers" min="1" max="5" step="1" value="1"><span class="val" id="v-consumers">1</span></div>
    <div class="row" data-k="vis"><label>Visibility timeout</label><input type="range" id="k-vis" min="5" max="60" step="1" value="30"><span class="val" id="v-vis">30 s</span></div>
    <div class="row" data-k="proc"><label>Processing time</label><input type="range" id="k-proc" min="0.5" max="20" step="0.5" value="1"><span class="val" id="v-proc">1.0 s</span></div>
    <div class="row" data-k="fail"><label>Failure rate</label><input type="range" id="k-fail" min="0" max="80" step="5" value="0"><span class="val" id="v-fail">0%</span></div>
    <div class="row" data-k="maxrecv"><label>maxReceiveCount</label><input type="range" id="k-maxrecv" min="1" max="10" step="1" value="3"><span class="val" id="v-maxrecv">3</span></div>
    <button class="toggle" data-k="fifo" id="k-fifo" role="switch" aria-checked="false"><span class="l">Queue type</span><span class="val" id="v-fifo">Standard</span><span class="sw"></span></button>
    <div class="actions" data-k="chaos">
      <button class="btn sm" id="k-chaos">Chaos: kill a consumer</button>
      <button class="btn sm ghost" id="k-burst">Burst ×24</button>
    </div>
    <div class="empty" id="k-empty">No knobs yet. Just tap SEND.</div>
    <div class="facts" id="facts"></div>
  </section>
</main>

<script src="../kit.js"></script>
<script>
(function () {
  "use strict";
  LAB.topbar("Living Sim: Queue", "Producer → SQS → Lambda · you are the client");

  /* ====================== palette (mirrors kit.css) ====================== */
  var COL = { flow: [90, 209, 255], warn: [245, 192, 84], bad: [255, 107, 107], ok: [74, 222, 128], accent: [255, 138, 61], violet: [182, 156, 255], dim: [125, 134, 148], ink: [238, 241, 246], ink2: [185, 192, 204] };
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (a == null ? 1 : a) + ")"; }
  function mix(a, b, t) { t = LAB.clamp(t, 0, 1); return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)]; }
  function ageColor(age) { return age < 8 ? mix(COL.flow, COL.warn, age / 8) : mix(COL.warn, COL.bad, (age - 8) / 14); }
  function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  /* ====================== chapters ====================== */
  var CH = [
    { chip: "1 Direct", title: "No queue", lesson: "A direct call has no memory.",
      goal: "Tap SEND fast. One Lambda, called directly: whatever arrives while it is busy is lost.",
      p: { queue: false, dlq: false, consumers: 1, proc: 1.2, rate: 0, vis: 30, fail: 0, maxRecv: 3, fifo: false }, knobs: [],
      target: 5, unit: "dropped", metric: function () { return S.dropped; },
      why: '<div class="eyebrow">Chapter 1 · Direct call</div><h3>Synchronous calls have no buffer</h3><p>When a producer invokes a consumer directly (an HTTP call, a synchronous Lambda invoke) the request only succeeds if the consumer is free <em>right now</em>. A burst bigger than the consumer\'s capacity is throttled, rejected or timed out, and the producer has to retry itself.</p><p>Nothing remembers the lost request. That is the problem a queue solves.</p><div class="fact"><b>Exam tip</b><span>"Decouple", "absorb spikes", "protect the database from bursts" all point at putting <strong>SQS</strong> between the tiers.</span></div>' },
    { chip: "2 Queue", title: "Add the queue", lesson: "SQS is a buffer: it absorbs bursts so consumers can work at their own pace.",
      goal: "Same spam, but now SQS sits in the middle. Nothing is dropped: the backlog grows, then drains. Fill 12 slots.",
      p: { queue: true, dlq: false, consumers: 1, proc: 1.0, rate: 0, vis: 30, fail: 0, maxRecv: 3, fifo: false }, knobs: ["rate"],
      target: 12, unit: "in queue", metric: function () { return S.peakDepth; },
      why: '<div class="eyebrow">Chapter 2 · The buffer</div><h3>SQS holds the work until a worker is ready</h3><p>A standard queue accepts a <strong>nearly unlimited</strong> number of messages per second and keeps each one until a consumer deletes it. Retention is <strong>4 days by default</strong> (1 minute to <strong>14 days</strong>). A message can be <strong>256 KB</strong> (<strong>1 MB since 2025</strong>); larger payloads go to S3 with a pointer in the message.</p><p>Consumers <em>pull</em>. With <strong>long polling</strong> (WaitTimeSeconds up to <strong>20 s</strong>) a receive call waits for a message instead of returning empty, which cuts request cost.</p><div class="fact"><b>Exam tip</b><span>Standard = best-effort ordering, at-least-once delivery, unlimited throughput. The depth of the queue is the buffer.</span></div>' },
    { chip: "3 Scale", title: "Scale consumers", lesson: "Scaling the consumer, not the queue, is how you catch up.",
      goal: "Press Burst ×24 and watch one Lambda crawl. Add consumers, burst again: drain the whole queue in under 5 s.",
      p: { queue: true, dlq: false, consumers: 1, proc: 0.6, rate: 0, vis: 30, fail: 0, maxRecv: 3, fifo: false }, knobs: ["rate", "consumers", "burst"],
      target: 1, unit: "drain", metric: function () { return (S.bestDrain != null && S.bestDrain < 5) ? 1 : 0; },
      prog: function () { return S.draining ? "draining " + (S.sim - S.burstAt).toFixed(1) + " s" : (S.bestDrain == null ? "no drain yet" : "best " + S.bestDrain.toFixed(1) + " s / 5 s"); },
      why: '<div class="eyebrow">Chapter 3 · Consumers scale</div><h3>Lambda polls the queue for you</h3><p>With an <strong>event source mapping</strong>, Lambda long-polls SQS and invokes your function with a batch (up to <strong>10</strong> messages per receive; up to <strong>10,000</strong> for standard queues with a batching window). Lambda starts with 5 pollers and adds up to <strong>300 concurrent invocations per minute</strong>, to a maximum of <strong>1,250</strong>; you can cap it with <em>maximum concurrency</em> (minimum 2).</p><p>The queue itself needs no scaling. The slider here is the consumer fleet.</p><div class="fact"><b>Exam tip</b><span>Backlog growing? Scale the consumers (more Lambda concurrency, more EC2 workers in an ASG on the <em>ApproximateNumberOfMessagesVisible</em> metric). Never "scale SQS".</span></div>' },
    { chip: "4 Timeout", title: "Visibility timeout", lesson: "Default 30 s; set it ≥ 6× your Lambda timeout; design consumers idempotent.",
      goal: "A received message is hidden, not deleted: the ring is the visibility timeout. Make processing take longer than the timeout to cause 3 duplicates, then fix it.",
      p: { queue: true, dlq: false, consumers: 3, proc: 3, rate: 1, vis: 10, fail: 0, maxRecv: 3, fifo: false }, knobs: ["rate", "consumers", "vis", "proc"],
      target: 2, unit: "", metric: function () { return S.visPhase; },
      prog: function () { return S.visPhase === 0 ? "duplicates " + Math.min(3, S.dupes) + " / 3" : S.visPhase === 1 ? "now fix it: " + S.cleanSince + " / 5 clean" : "fixed"; },
      why: '<div class="eyebrow">Chapter 4 · Visibility timeout</div><h3>Receiving hides the message; deleting removes it</h3><p>A received message stays in the queue but is <strong>invisible</strong> for the visibility timeout: <strong>30 s by default</strong>, up to <strong>12 hours</strong>. If the consumer does not delete it in time, it becomes visible again and another consumer receives it. That is why SQS is <strong>at-least-once</strong>.</p><p>For Lambda, set the queue\'s visibility timeout to at least <strong>6× the function timeout</strong>. Long jobs can extend their lease with <em>ChangeMessageVisibility</em>. Either way, make the consumer <strong>idempotent</strong>: processing the same message twice must be harmless.</p><div class="fact"><b>Exam tip</b><span>"Messages processed twice, processing takes longer than expected" means raise the visibility timeout. FIFO does not fix this.</span></div>' },
    { chip: "5 DLQ", title: "Poison messages + DLQ", lesson: "A redrive policy quarantines poison messages instead of looping forever.",
      goal: "Some messages always fail. Without a limit they loop forever. With maxReceiveCount they slide into the dead-letter queue. Send 3 to the DLQ.",
      p: { queue: true, dlq: true, consumers: 2, proc: 1, rate: 2, vis: 5, fail: 50, maxRecv: 2, fifo: false }, knobs: ["rate", "consumers", "vis", "proc", "fail", "maxrecv", "poison"],
      target: 3, unit: "in DLQ", metric: function () { return S.dlq.length; },
      why: '<div class="eyebrow">Chapter 5 · Dead-letter queue</div><h3>Stop the poison pill from eating your fleet</h3><p>A failed consumer does not delete the message, so after the visibility timeout it comes back. A <strong>redrive policy</strong> counts receives; when <em>ReceiveCount</em> exceeds <strong>maxReceiveCount</strong> (1 to 1,000) SQS moves the message to the <strong>dead-letter queue</strong>. The DLQ must be the same type as the source (standard or FIFO).</p><p>Alarm on the DLQ\'s depth, fix the bug, then <strong>redrive</strong> the messages back to the source queue. Note: a message\'s retention clock starts at its <em>original</em> send time, so give the DLQ a longer retention than the source.</p><div class="fact"><b>Exam tip</b><span>"Some messages always fail and must be investigated" means DLQ + maxReceiveCount. For Lambda, enable <em>ReportBatchItemFailures</em> so one bad message does not fail the whole batch.</span></div>' },
    { chip: "6 FIFO", title: "FIFO vs Standard", lesson: "FIFO = exactly-once processing + order within a group, at the cost of throughput.",
      goal: "Standard delivers fast and roughly in order. Switch to FIFO: each message group becomes a strict lane. Process 9 messages in order.",
      p: { queue: true, dlq: false, consumers: 3, proc: 1, rate: 3, vis: 30, fail: 0, maxRecv: 3, fifo: false }, knobs: ["rate", "consumers", "fifo"],
      target: 9, unit: "in order (FIFO)", metric: function () { return Math.min(9, S.fifoInOrder); },
      why: '<div class="eyebrow">Chapter 6 · FIFO queues</div><h3>Order and dedup, with a throughput ceiling</h3><p>A FIFO queue (name ends in <code>.fifo</code>) guarantees order <strong>inside a message group</strong> and processes groups in parallel; only one batch per group is in flight at a time, so a stuck message blocks its lane. A <strong>deduplication ID</strong> suppresses producer retries for <strong>5 minutes</strong>: that is the "exactly-once" part.</p><p>Limits: <strong>300 messages/s</strong>, or <strong>3,000/s with batching</strong> (10 per batch); high-throughput mode goes far beyond that. Standard queues are nearly unlimited.</p><div class="fact"><b>Exam tip</b><span>Dedup only covers the <em>producer</em>. A consumer that crashes before deleting still gets the message again after the visibility timeout, on FIFO too.</span></div>' },
    { chip: "7 Play", title: "Playground", lesson: "You have the whole pipeline now. Break it on purpose.",
      goal: "Everything unlocked. Kill a consumer mid-job and watch SQS hand its message to someone else.",
      p: { queue: true, dlq: true, consumers: 3, proc: 2, rate: 4, vis: 8, fail: 15, maxRecv: 3, fifo: false }, knobs: ["rate", "consumers", "vis", "proc", "fail", "maxrecv", "fifo", "chaos", "poison", "burst"],
      target: 1, unit: "chaos", metric: function () { return S.chaosUsed ? 1 : 0; },
      why: '<div class="eyebrow">Chapter 7 · Playground</div><h3>The whole SQS story in one picture</h3><p>Producer sends. The queue keeps every message (4 days by default, up to 14). Consumers receive and the message hides for the visibility timeout (30 s default, 12 h max). Delete on success; otherwise it comes back, and after <em>maxReceiveCount</em> it goes to the DLQ.</p><p>Kill a consumer: its message is still in the queue, hidden. When the ring runs out, another consumer picks it up. Nothing is lost. That is the durability you pay for with at-least-once delivery.</p><div class="fact"><b>Exam tip</b><span>Standard vs FIFO · visibility timeout · DLQ + redrive · long polling (20 s) · SNS fan-out to many SQS queues. These five cover most SQS questions.</span></div>' }
  ];

  /* ====================== state ====================== */
  var P = {};           // live parameters
  var S = {};           // sim state
  var MAX = 200;
  var speed = 1, paused = false, chapter = 0;
  var done = [];
  try { done = JSON.parse(localStorage.getItem("lab-queue-done") || "[]"); } catch (e) { }

  function freshState() {
    S = { sim: 0, q: [], fx: [], dlq: [], cons: [], toasts: [], order: [], completions: [], spark: [], sparkAcc: 0,
      sent: 0, seq: 0, gseq: { A: 0, B: 0, C: 0 }, dropped: 0, processed: 0, dupes: 0, peakDepth: 0, maxSeq: 0, lastGroupSeq: { A: 0, B: 0, C: 0 },
      burstAt: null, draining: false, bestDrain: null, visPhase: 0, cleanSince: 0, fifoInOrder: 0, chaosUsed: false, goalDone: false, rateAcc: 0, lastSend: 0, flying: [] };
  }

  function setConsumers(n) {
    while (S.cons.length < n) S.cons.push({ msg: null, dead: false, deadLeft: 0, flash: 0, glow: 0 });
    while (S.cons.length > n) { var c = S.cons.pop(); if (c.msg) returnToQueue(c.msg, true); }
  }

  /* ====================== messages ====================== */
  function newMsg(o) {
    o = o || {};
    var group = P.fifo ? ["A", "B", "C"][Math.floor(Math.random() * 3)] : null;
    S.seq++;
    var label = group ? group + (++S.gseq[group]) : String(S.seq);
    return { id: S.seq, seq: S.seq, gseq: group ? S.gseq[group] : S.seq, label: label, group: group, state: "queued",
      x: LAB.spring(0, { stiffness: 240, damping: 22 }), y: LAB.spring(0, { stiffness: 240, damping: 24 }),
      alpha: 1, receives: 0, enqAt: S.sim, visLeft: 0, visTotal: 1, procLeft: 0, procTotal: 1, consumer: null,

    if (m.appear < 1) { a *= 0.25 + 0.75 * m.appear; sc = 0.6 + 0.4 * m.appear; }
    if (a <= 0) return;
    g.save(); g.globalAlpha = LAB.clamp(a, 0, 1); g.translate(x, y); g.scale(sc, sc);
    if (m.failFlash > 0) { g.shadowColor = rgba(COL.bad, m.failFlash); g.shadowBlur = 14; }
    else if (m.state === "inflight") { g.shadowColor = rgba(COL.flow, 0.5); g.shadowBlur = 10; }
    rr(g, -s / 2, -s / 2, s, s, 4);
    g.fillStyle = rgba(col, m.ghost ? 0.5 : 0.95); g.fill();
    if (m.ghost) { g.setLineDash([2, 2]); g.strokeStyle = rgba(col, 1); g.lineWidth = 1; g.stroke(); g.setLineDash([]); }
    if (m.dupOf != null && m.state !== "done") { g.strokeStyle = rgba(COL.warn, 0.95); g.lineWidth = 1.5; g.stroke(); }
    g.shadowBlur = 0;
    if (m.state === "done" && !m.killed) { // spark
      g.strokeStyle = rgba(COL.ok, 1 - m.t / 0.6); g.lineWidth = 1.5;
      for (var k = 0; k < 5; k++) { var ang = k / 5 * Math.PI * 2 + 0.4, r1 = s * 0.7 + m.t * 10, r2 = r1 + 4; g.beginPath(); g.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1); g.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2); g.stroke(); }
    }
    var lbl = m.label.length > 3 ? m.label.slice(-3) : m.label;
    g.font = "600 " + (lbl.length > 2 ? (s >= 20 ? 9 : 8) : (s >= 18 ? 10 : 9)) + "px " + mono(); g.textAlign = "center"; g.fillStyle = "rgba(10,12,18,0.95)";
    if (m.state === "dlq" || m.poison || m.state === "dropped") g.fillStyle = "rgba(255,255,255,0.95)";
    g.fillText(lbl, 0, 0.5);
    if (m.receives > 1 && m.state !== "done") { // receive count badge
      g.fillStyle = rgba(COL.warn, 1); g.beginPath(); g.arc(s / 2 - 1, -s / 2 + 1, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#1a0d04"; g.font = "700 7px " + mono(); g.fillText(m.receives, s / 2 - 1, -s / 2 + 1.5);
    }
    g.restore();
  }
  function drawRing(m) {
    var r = L.ms / 2 + 6, f = LAB.clamp(m.visLeft / m.visTotal, 0, 1), x = m.x.value, y = m.y.value;
    var col = f > 0.5 ? COL.flow : f > 0.2 ? mix(COL.warn, COL.flow, (f - 0.2) / 0.3) : mix(COL.bad, COL.warn, f / 0.2);
    g.save(); g.lineWidth = 3; g.lineCap = "round";
    g.strokeStyle = "rgba(255,255,255,0.08)"; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    if (m.timedOut) { g.strokeStyle = rgba(COL.bad, 0.8); g.setLineDash([3, 3]); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
    else if (f > 0) { g.strokeStyle = rgba(col, 0.95); g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); g.stroke(); }
    g.restore();
  }

  /* ====================== sparkline ====================== */
  var spEl = document.getElementById("spark"), SP = LAB.canvas(spEl), sg = SP.g;
  function drawSpark() {
    var w = SP.size().w, h = SP.size().h; sg.clearRect(0, 0, w, h);
    var data = S.spark; if (data.length < 2) { sg.strokeStyle = rgba(COL.ink, 0.1); sg.beginPath(); sg.moveTo(0, h - 1); sg.lineTo(w, h - 1); sg.stroke(); return; }
    var max = Math.max(4, Math.max.apply(null, data)), n = 120;
    sg.beginPath();
    for (var i = 0; i < data.length; i++) { var x = (n - data.length + i) / (n - 1) * w, y = h - 2 - (data[i] / max) * (h - 14); if (i === 0) sg.moveTo(x, y); else sg.lineTo(x, y); }
    sg.strokeStyle = rgba(COL.flow, 0.95); sg.lineWidth = 1.5; sg.stroke();
    sg.lineTo(w, h); sg.lineTo((n - data.length) / (n - 1) * w, h); sg.closePath();
    var gr = sg.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, rgba(COL.flow, 0.28)); gr.addColorStop(1, rgba(COL.flow, 0)); sg.fillStyle = gr; sg.fill();
    sg.font = "600 10px " + mono(); sg.textAlign = "right"; sg.textBaseline = "top"; sg.fillStyle = rgba(COL.dim); sg.fillText("peak " + Math.max.apply(null, data), w, 0);
  }

  /* ====================== stats / goal DOM ====================== */
  var $ = function (id) { return document.getElementById(id); };
  var statTimer = 0, lastStats = {};
  function updateStats(force) {
    var oldest = 0; S.q.forEach(function (m) { if (!m.ghost) oldest = Math.max(oldest, S.sim - m.enqAt); });
    var vals = { depth: S.q.length, inflight: inflight().length, rate: S.completions.length / 3, dup: P.queue ? S.dupes : S.dropped, dlq: S.dlq.length, age: oldest };
    function set(id, key, fmt) { if (!force && lastStats[key] === vals[key]) return; lastStats[key] = vals[key]; LAB.count($(id), vals[key], { fmt: fmt, ms: 350 }); }
    set("s-depth", "depth"); set("s-inflight", "inflight"); set("s-rate", "rate", function (n) { return n.toFixed(1); });
    set("s-dup", "dup"); set("s-dlq", "dlq"); set("s-age", "age", function (n) { return n.toFixed(1) + " s"; });
    $("s-dup-k").textContent = P.queue ? "Duplicates" : "Dropped";
    $("s-dup").className = "v " + (P.queue ? "warn" : "bad");
    $("s-age").className = "v " + (oldest > 8 ? (oldest > 20 ? "bad" : "warn") : "");
    drawSpark(); updateGoal();
  }
  function updateGoal() {
    var ch = CH[chapter], v = ch.metric(), goalEl = $("goal");
    $("g-bar").style.width = Math.round(LAB.clamp(v / ch.target, 0, 1) * 100) + "%";
    $("g-prog").textContent = ch.prog ? ch.prog() : (chapter === 6 ? (S.chaosUsed ? "chaos used" : "try chaos") : Math.min(v, ch.target) + " / " + ch.target + " " + ch.unit);
    if (!S.goalDone && v >= ch.target) {
      S.goalDone = true; goalEl.classList.add("done");
      if (done.indexOf(chapter) < 0) { done.push(chapter); try { localStorage.setItem("lab-queue-done", JSON.stringify(done)); } catch (e) { } }
      renderChips(); LAB.haptic("ok"); LAB.sound.play("ok");
      $("g-next").style.display = chapter < CH.length - 1 ? "" : "none";
    }
  }
  function renderChips() {
    var nav = $("chapters"); nav.innerHTML = "";
    CH.forEach(function (ch, i) {
      var b = LAB.h('<button class="chip' + (i === chapter ? " on" : "") + (done.indexOf(i) >= 0 ? " done" : "") + '"><i></i>' + LAB.esc(ch.chip) + '</button>');
      b.onclick = function () { setChapter(i); LAB.haptic("tap"); };
      nav.appendChild(b);
    });
    var on = nav.querySelector(".chip.on"); if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); } catch (e) { } }
  }

  /* ====================== knobs ====================== */
  var K = { rate: $("k-rate"), consumers: $("k-consumers"), vis: $("k-vis"), proc: $("k-proc"), fail: $("k-fail"), maxrecv: $("k-maxrecv") };
  function syncKnobsFromP() {
    K.rate.value = P.rate; K.consumers.value = P.consumers; K.vis.value = P.vis; K.proc.value = P.proc; K.fail.value = P.fail; K.maxrecv.value = P.maxRecv;
    $("k-fifo").setAttribute("aria-checked", String(P.fifo)); showVals();
  }
  function showVals() {
    $("v-rate").textContent = P.rate ? P.rate + " /s" : "off"; $("v-consumers").textContent = P.consumers;
    $("v-vis").textContent = P.vis + " s"; $("v-proc").textContent = P.proc.toFixed(1) + " s"; $("v-fail").textContent = P.fail + "%";
    $("v-maxrecv").textContent = P.maxRecv; $("v-fifo").textContent = P.fifo ? "FIFO" : "Standard";
    $("status").innerHTML = (P.queue ? "<b>" + (P.fifo ? "FIFO" : "Standard") + "</b> · " : "<b>direct</b> · ") + "<b>" + P.consumers + "</b> λ · proc <b>" + P.proc.toFixed(1) + " s</b>" + (P.queue ? " · vis <b>" + P.vis + " s</b>" : "") + (P.dlq ? " · DLQ <b>" + P.maxRecv + "×</b>" : "");
  }
  K.rate.oninput = function () { P.rate = +this.value; showVals(); };
  K.consumers.oninput = function () { P.consumers = +this.value; setConsumers(P.consumers); showVals(); LAB.haptic("tick"); };
  K.vis.oninput = function () { P.vis = +this.value; showVals(); };
  K.proc.oninput = function () { P.proc = +this.value; showVals(); };
  K.fail.oninput = function () { P.fail = +this.value; showVals(); };
  K.maxrecv.oninput = function () { P.maxRecv = +this.value; showVals(); };
  $("k-fifo").onclick = function () {
    P.fifo = !P.fifo; this.setAttribute("aria-checked", String(P.fifo)); showVals(); LAB.haptic("tap");
    S.fifoInOrder = 0; S.order = [];
    S.q.forEach(function (m) { if (P.fifo && !m.group) { m.group = ["A", "B", "C"][Math.floor(Math.random() * 3)]; m.gseq = ++S.gseq[m.group]; m.label = m.group + m.gseq; } else if (!P.fifo && m.group) { m.group = null; m.label = String(m.seq); m.gseq = m.seq; } });
    inflight().forEach(function (m) { if (!P.fifo && m.group) { m.group = null; m.label = String(m.seq); } });
    toast(P.fifo ? "FIFO: 300 msg/s (3,000 batched), lanes" : "Standard: unlimited rate, best-effort order", P.fifo ? COL.violet : COL.flow);
  };
  $("k-chaos").onclick = function () { killConsumer(); };
  $("k-burst").onclick = function () { burst(24); };
  function showKnobs(list) {
    var any = false;
    document.querySelectorAll("#knobs [data-k]").forEach(function (el) {
      var k = el.getAttribute("data-k"), on = list.indexOf(k) >= 0 || (k === "chaos" && (list.indexOf("chaos") >= 0 || list.indexOf("burst") >= 0));
      el.classList.toggle("show", on); if (on) any = true;
    });
    $("k-chaos").style.display = list.indexOf("chaos") >= 0 ? "" : "none";
    $("k-burst").style.display = list.indexOf("burst") >= 0 ? "" : "none";
    $("k-empty").style.display = any ? "none" : "";
  }

  /* ====================== chapter control ====================== */
  function setChapter(i, keepKnobs) {
    chapter = i; var ch = CH[i];
    if (!keepKnobs) { P = {}; for (var k in ch.p) P[k] = ch.p[k]; }
    freshState(); setConsumers(P.consumers); layout(); paused = false; $("t-pause").setAttribute("aria-pressed", "false"); $("ic-pause").style.display = ""; $("ic-play").style.display = "none";
    syncKnobsFromP(); showKnobs(ch.knobs);
    $("g-eyebrow").textContent = "Chapter " + (i + 1) + " of 7"; $("g-title").textContent = ch.title; $("g-text").textContent = ch.goal; $("g-lesson").textContent = ch.lesson;
    $("goal").classList.remove("done"); S.goalDone = false; lastStats = {}; updateStats(true);
    var s2 = $("send2"); s2.className = "send2";
    if (ch.knobs.indexOf("burst") >= 0 && i === 2) { s2.textContent = "Burst ×24"; s2.classList.add("show"); s2.onclick = function () { burst(24); }; }
    else if (ch.knobs.indexOf("poison") >= 0) { s2.textContent = "Send poison"; s2.classList.add("show", "poison"); s2.onclick = function () { send({ poison: true }); }; }
    $("facts").innerHTML = factsFor(i);
    if (i === 3) { S.visPhase = 0; }
    renderChips();
    try { localStorage.setItem("lab-queue-ch", String(i)); } catch (e) { }
  }
  function factsFor(i) {
    return [
      "Direct invoke: no retry memory. Lambda sync invoke returns <b>429</b> when throttled.",
      "Standard queue · retention <b>4 d</b> default (<b>14 d</b> max) · message <b>256 KB</b>, <b>1 MB</b> since 2025 · long polling up to <b>20 s</b>.",
      "Lambda event source mapping: batch up to <b>10</b> (<b>10,000</b> with a batching window) · scales <b>+300</b>/min to <b>1,250</b> concurrent batches.",
      "Visibility timeout · default <b>30 s</b> · max <b>12 h</b> · Lambda rule: <b>≥ 6×</b> function timeout · extend with ChangeMessageVisibility.",
      "Redrive policy · maxReceiveCount <b>1–1,000</b> · DLQ same type as source · retention counts from the original send.",
      "FIFO · <b>300 msg/s</b>, <b>3,000</b> with batching · dedup window <b>5 min</b> · one in-flight batch per message group.",
      "At-least-once (standard) · exactly-once processing (FIFO) · in-flight limit <b>120,000</b> standard, <b>20,000</b> FIFO."
    ][i];
  }
  $("g-why").onclick = function () { LAB.sheet(CH[chapter].why); };
  $("g-next").onclick = function () { if (chapter < CH.length - 1) setChapter(chapter + 1); };

  /* ====================== transport ====================== */
  $("t-pause").onclick = function () { paused = !paused; this.setAttribute("aria-pressed", String(paused)); this.classList.toggle("on", paused); $("ic-pause").style.display = paused ? "none" : ""; $("ic-play").style.display = paused ? "" : "none"; LAB.haptic("tap"); };
  $("t-speed").onclick = function () { speed = speed === 1 ? 4 : 1; this.textContent = speed + "×"; this.classList.toggle("on", speed === 4); LAB.haptic("tap"); };
  $("t-reset").onclick = function () { setChapter(chapter, true); LAB.haptic("tap"); LAB.sound.play("whoosh"); };

  /* ====================== send button ====================== */
  var sendEl = $("send");
  function onSend(e) { if (e) e.preventDefault(); if (paused) { paused = false; $("t-pause").click(); paused = false; }
    sendEl.classList.add("hit"); setTimeout(function () { sendEl.classList.remove("hit"); }, 90); send(); }
  sendEl.addEventListener("pointerdown", onSend);
  sendEl.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") onSend(e); });
  document.addEventListener("keydown", function (e) { if (e.key === " " && document.activeElement === document.body) onSend(e); });

  /* ====================== main loop ====================== */
  var acc = 0;
  LAB.loop(function (dt, t) {
    layout();
    if (!paused) { var sdt = dt * speed, sub = Math.ceil(sdt / 0.05); for (var i = 0; i < sub; i++) step(sdt / sub); }
    targetQueue();
    var k = Math.min(speed, 2) * dt * (LAB.reducedMotion ? 10 : 1);
    S.q.forEach(function (m) { if (!m.hidden) { m.x.step(k); m.y.step(k); } });
    S.dlq.forEach(function (m) { if (!m.hidden) { m.x.step(k); m.y.step(k); } });
    S.cons.forEach(function (c) { var m = c.msg; if (m) { m.x.step(k); m.y.step(k); if (!m.arrived && landed(m)) m.arrived = true; } });
    for (var j = S.fx.length - 1; j >= 0; j--) { var f = S.fx[j]; f.t += dt; if (f.state === "dropped" && f.t > 0.25 && !f.fell) { f.fell = true; f.y.set(f.y.target + 40); } f.x.step(dt); f.y.step(dt); if (f.t > (f.state === "dropped" ? 0.9 : 0.6)) S.fx.splice(j, 1); }
    if (!paused) S.toasts.forEach(function (tt) { tt.t += dt; }); S.toasts = S.toasts.filter(function (tt) { return tt.t < 3; });
    draw(t);
    acc += dt; if (acc > 0.15) { acc = 0; updateStats(); }
    var idle = S.sim - S.lastSend > 4 && S.sent === 0 && (chapter === 0 || chapter === 1);
    sendEl.classList.toggle("pulse", idle && !LAB.reducedMotion);
  });

  var startCh = 0; try { startCh = Math.min(6, Math.max(0, +(localStorage.getItem("lab-queue-ch") || 0))) || 0; } catch (e) { }
  setChapter(startCh);
})();
</script>
</body>
