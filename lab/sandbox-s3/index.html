<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Sandbox · S3 — Futureproof LAB</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* ---------- page grid ---------- */
  .wrap { padding-bottom: 250px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .stage { padding: 14px; margin-bottom: 12px; }
  @media (min-width: 900px) {
    .wrap { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: start; }
    .stage { margin-bottom: 0; }
  }

  /* ---------- the bucket ---------- */
  .bucket {
    position: relative; border: 1px solid var(--line-strong); border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(0,0,0,0.14));
  }
  .rim { height: 5px; background: linear-gradient(90deg, rgba(255,138,61,.65), rgba(90,209,255,.55)); opacity: .75; }
  .bhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 8px; border-bottom: 1px dashed var(--line); }
  .bname { min-width: 0; }
  .bname .k { display: block; margin-bottom: 1px; }
  .bname b { display: block; font-family: var(--mono); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bname .rg { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .azs { display: flex; gap: 7px; align-items: center; flex: none; }
  .azs .k { margin-right: 2px; }
  .pip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); transition: opacity .3s, transform .4s var(--spring); }
  .pip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok-glow); transition: background .2s, box-shadow .2s; }
  .pip.down { opacity: .35; transform: translateY(3px); }
  .pip.down i { background: var(--bad); box-shadow: none; }

  /* shelves = storage tiers */
  .shelf { display: grid; grid-template-columns: 118px 1fr; gap: 8px; padding: 7px 10px 9px; min-height: 58px; border-bottom: 1px solid var(--line); align-items: center; position: relative; }
  .shelf:last-child { border-bottom: 0; }
  .shelf::after { content: ""; position: absolute; left: 136px; right: 10px; bottom: 5px; height: 1px; background: rgba(255,255,255,0.07); }
  .shelf .lbl { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .shelf .lbl b { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .shelf .lbl b i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 6px var(--c); }
  .shelf .lbl .p { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
  .shelf .lbl .m { font-size: 9.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; align-items: flex-start; }

  /* object tiles */
  .tile {
    --c: var(--flow);
    position: relative; flex: 0 0 calc(50% - 3px); min-width: 0; min-height: 44px; padding: 6px 8px 6px 18px;
    border-radius: 10px; text-align: left; background: rgba(255,255,255,0.055); border: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    transition: transform .55s var(--spring), opacity .3s, box-shadow .2s, border-color .2s;
    will-change: transform;
  }
  @media (min-width: 900px) { .tile { flex: 0 0 138px; } }
  .tile .dot { position: absolute; left: 7px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .tile .key { font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .tile .sz { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .tile.marked .key { text-decoration: line-through; color: var(--ink-dim); }
  .tile .badge { position: absolute; right: 6px; top: -7px; font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: var(--panel-solid); border: 1px solid var(--warn); color: var(--warn); white-space: nowrap; }
  .tile .vc { position: absolute; right: 6px; bottom: 3px; font-family: var(--mono); font-size: 9.5px; color: var(--ink-dim); }
  .tile .pubdot { position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad-glow); }
  .tile.stack::before, .tile.stack::after { content: ""; position: absolute; inset: 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); z-index: -1; }
  .tile.stack::before { transform: translate(3px, 3px); }
  .tile.stack::after { transform: translate(6px, 6px); opacity: .6; }
  .tile.out { opacity: 0; transform: scale(.8); pointer-events: none; }
  .tile .parts { display: flex; gap: 2px; margin-top: 3px; }
  .tile .parts i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); overflow: hidden; position: relative; }
  .tile .parts i::after { content: ""; position: absolute; inset: 0; background: var(--flow); transform: scaleX(0); transform-origin: left; transition: transform .36s var(--ease-out); }
  .tile .parts i.on::after { transform: scaleX(1); }

  /* versions list */
  .vlist { border-top: 1px dashed var(--line); padding: 8px 12px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
  .vlist .vr { display: flex; gap: 8px; flex-wrap: wrap; line-height: 1.4; }
  .vlist .vr b { color: var(--ink); font-weight: 600; }
  .vlist .vr .cur { color: var(--accent-2); }
  .vlist .vr .mk { color: var(--warn); }
  .vlist .empty { color: var(--ink-dim); }
  .stage-chips { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stage-chips .btn.ghost.sm { border-color: var(--line); color: var(--ink-2); padding: 0 10px; }
  .stage-chips .btn.ghost.sm.on { border-color: var(--bad-glow); color: var(--bad); }

  /* ---------- cost + time ---------- */
  .costrow { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .costrow .stat .v { font-size: 22px; }
  .scrub-head { display: flex; align-items: center; justify-content: space-between; }
  .scrub-head label { font-size: 13px; color: var(--ink-2); }
  .scrub-head .val { font-family: var(--mono); font-size: 13px; }
  .ticks { position: relative; height: 16px; margin: -6px 13px 0; }
  .ticks span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 9.5px; color: var(--ink-dim); white-space: nowrap; padding-top: 5px; }
  .ticks span::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 4px; background: var(--line-strong); }

  /* ---------- settings ---------- */
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }
  .toggle { width: 100%; justify-content: flex-start; min-height: 50px; text-align: left; border-radius: 12px; padding: 2px 4px; transition: background .2s; }
  .toggle:active { background: rgba(255,255,255,0.04); }
  .toggle .tl { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .toggle .tl b { font-size: 12.5px; font-weight: 600; }
  .toggle .tl small { font-size: 10.5px; color: var(--ink-dim); font-family: var(--mono); }
  .toggle[aria-disabled="true"] { opacity: .55; }
  .toggle[aria-disabled="true"] .tl small { color: var(--warn); }

  /* ---------- trace ---------- */
  .log { font-family: var(--mono); font-size: 11px; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; min-height: 130px; margin-top: 8px; }
  .ln { word-break: break-word; color: var(--ink-2); }
  .ln .m { color: var(--flow); font-weight: 600; }
  .ln .ok { color: var(--ok); font-weight: 600; }
  .ln .bad { color: var(--bad); font-weight: 600; }
  .ln .wn { color: var(--warn); font-weight: 600; }

  /* ---------- command tray (grows upward with a spring) ---------- */
  .tray {
    --dh: calc(84px + var(--sa-bottom));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 920px; margin: 0 auto;
    background: var(--panel-solid); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 20px 20px 0 0;
    box-shadow: 0 -20px 50px -20px rgba(0,0,0,0.9);
    transform: translateY(var(--dh)); transition: transform .55s var(--spring); will-change: transform;
  }
  .tray.open { transform: none; }
  .tray-in { padding: 10px 12px calc(12px + var(--sa-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .tray-row { display: flex; gap: 8px; }
  .tray-row .btn { flex: 1; padding: 0 8px; font-size: 13px; white-space: nowrap; min-width: 0; }
  .tray-detail { height: calc(84px + var(--sa-bottom)); padding: 0 14px var(--sa-bottom); display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); opacity: 0; transition: opacity .3s; }
  .tray.open .tray-detail { opacity: 1; }
  .ring { width: 40px; height: 40px; flex: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: rgba(255,255,255,0.1); }
  .ring .fg { stroke: var(--flow); stroke-linecap: round; }
  .url { min-width: 0; flex: 1; }
  .url .u { font-family: var(--mono); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--flow); }
  .url .s { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  .url .s .mono { color: var(--ink); }
  .tray-detail.dead .u { color: var(--ink-dim); text-decoration: line-through; }
  .tray-detail.dead .fg { stroke: var(--ink-dim); }
  .tray-detail .x { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-dim); flex: none; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 12px; right: 12px; z-index: 35; max-width: 600px; margin: 0 auto; padding: 10px 14px; border-radius: 14px;
    background: var(--panel-solid); border: 1px solid var(--line-strong); font-size: 13px; line-height: 1.4; color: var(--ink);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85);
    transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .45s var(--spring), opacity .25s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast b { color: var(--accent); margin-left: 6px; font-weight: 600; white-space: nowrap; }
  .toast.warn { border-color: rgba(245,192,84,.55); }
  .toast.bad { border-color: var(--bad-glow); }
  .toast.ok { border-color: var(--ok-glow); }
</style>
</head>
<body>
<main class="wrap">
  <section class="panel stage rise" id="stage">
    <div class="bucket">
      <div class="rim"></div>
      <div class="bhead">
        <div class="bname"><span class="k">Bucket</span><b>my-app-assets</b><span class="rg">eu-central-1 · 3 AZs</span></div>
        <div class="azs" aria-label="Availability zones"><span class="k">AZ</span>
          <span class="pip" id="az-a"><i></i>a</span><span class="pip" id="az-b"><i></i>b</span><span class="pip" id="az-c"><i></i>c</span>
        </div>
      </div>
      <div class="shelves" id="shelves"></div>
      <div class="vlist" id="vlist" hidden></div>
    </div>
    <div class="stage-chips">
      <button class="btn ghost sm" id="chipVersions">Show versions</button>
      <button class="btn ghost sm" id="chipAz">Lose an AZ</button>
      <button class="btn ghost sm" id="chipReset">Reset</button>
    </div>
  </section>

  <div class="col">
    <section class="panel pad rise d1">
      <div class="costrow">
        <div class="stat"><div class="k">≈ storage / month</div><div class="v flow" id="cost">$0.000</div></div>
        <div class="stat"><div class="k">Objects</div><div class="v" id="nObj">0</div></div>
        <div class="stat"><div class="k">Versions</div><div class="v" id="nVer">0</div></div>
      </div>
      <div class="scrub-head"><label for="day">Time machine</label><span class="val" id="dayVal">Day 0</span></div>
      <input type="range" id="day" min="0" max="365" value="0" step="1" aria-label="Days since upload">
      <div class="ticks">
        <span style="left:0%">0</span>
        <span style="left:8.22%">30 d</span>
        <span style="left:24.66%">90 d</span>
        <span style="left:49.32%">180 d</span>
        <span style="left:100%">365</span>
      </div>
    </section>

    <section class="panel pad rise d2">
      <div class="k">Bucket settings</div>
      <div class="settings">
        <button class="toggle" role="switch" aria-checked="false" data-set="versioning"><span class="sw"></span><span class="tl"><b>Versioning</b><small>off</small></span></button>
        <button class="toggle" role="switch" aria-checked="true" data-set="bpa"><span class="sw"></span><span class="tl"><b>Block Public Access</b><small>on · default</small></span></button>
        <button class="toggle" role="switch" aria-checked="false" data-set="lifecycle"><span class="sw"></span><span class="tl"><b>Lifecycle rule</b><small>IA 30 d · Glacier 90 d · Deep 180 d</small></span></button>
        <button class="toggle" role="switch" aria-checked="false" data-set="lock"><span class="sw"></span><span class="tl"><b>Object Lock</b><small>compliance · 7 y</small></span></button>
      </div>
    </section>

    <section class="panel pad rise d3">
      <div class="k">Under the hood</div>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<div class="tray" id="tray">
  <div class="tray-in">
    <div class="tray-row">
      <button class="btn primary" id="aUpload">Upload object</button>
      <button class="btn" id="aBig">Upload 6 GB video</button>
    </div>
    <div class="tray-row">
      <button class="btn" id="aDelete">Delete</button>
      <button class="btn" id="aPublic">Make public</button>
      <button class="btn" id="aSign">Presigned URL</button>
    </div>
  </div>
  <div class="tray-detail" id="detail">
    <svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="16"></circle><circle class="fg" id="ring" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="0"></circle></svg>
    <div class="url"><div class="u" id="url"></div><div class="s" id="urlS"></div></div>
    <button class="x" id="detailClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../kit.js"></script>
<script>
(function () {
  "use strict";
  LAB.topbar("Service Sandbox · S3", "Touch the service before reading about it");

  /* ---------- AWS truth (≈ us-east-1 prices, per GB-month) ---------- */
  var TIERS = [
    { id: "STANDARD",     name: "Standard",         price: 0.023,   color: "#5ad1ff", min: "no minimum · ms reads" },
    { id: "STANDARD_IA",  name: "Standard-IA",      price: 0.0125,  color: "#b69cff", min: "30 d min · ≥128 KB each" },
    { id: "GLACIER_IR",   name: "Glacier Instant",  price: 0.004,   color: "#f5c054", min: "90 d min · ms reads" },
    { id: "GLACIER",      name: "Glacier Flexible", price: 0.0036,  color: "#ff8a3d", min: "90 d min · restore first" },
    { id: "DEEP_ARCHIVE", name: "Deep Archive",     price: 0.00099, color: "#7d8694", min: "180 d min · 12–48 h" }
  ];
  function tierForAge(a) { return a >= 180 ? 4 : a >= 90 ? 3 : a >= 30 ? 1 : 0; }
  var MIN_IA_GB = 128 / 1048576;
  var POOL = [
    ["img/hero.jpg", "1.2 MB"], ["logs/2026-10-25.gz", "48 KB"], ["backup/db.snap", "2.1 GB"],
    ["data/export.parquet", "850 MB"], ["models/weights.bin", "3.4 GB"], ["img/og-card.png", "640 KB"],
    ["archive/2025.tar", "4.8 GB"], ["users/avatar-91.webp", "96 KB"]
  ];
  var BUCKET = "my-app-assets", HOST = "https://my-app-assets.s3.eu-central-1.amazonaws.com/";
  var RETAIN = (function () { var d = new Date(); d.setFullYear(d.getFullYear() + 7); return d.toISOString().slice(0, 10); })();

  function parseSize(s) { var m = s.match(/([\d.]+)\s*(KB|MB|GB)/); var n = parseFloat(m[1]); return m[2] === "GB" ? n : m[2] === "MB" ? n / 1024 : n / 1048576; }
  function rid(n) { var a = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", s = ""; for (var i = 0; i < (n || 4); i++) s += a[Math.random() * a.length | 0]; return s + "…"; }
  function hex(n) { var s = ""; for (var i = 0; i < n; i++) s += (Math.random() * 16 | 0).toString(16); return s; }
  function fmtMoney(n) { return n >= 10 ? LAB.money(n) : "$" + n.toFixed(3); }

  /* ---------- lessons: sheet on first occurrence, toast after ---------- */
  var SHEETS = {
    "versioned-delete": { line: "Delete marker added. Old versions stay and keep billing.",
      html: '<div class="eyebrow">Versioning</div><h3>Deleted, but not gone</h3><p>With versioning on, <span class="mono">DELETE</span> only puts a <b>delete marker</b> on top. Every older version stays, and keeps billing at its storage class. Remove the marker and the object is back.</p><div class="fact"><b>Exam tip</b><span>"Storage bill grows although we delete" → noncurrent versions. Add a noncurrent-version expiration lifecycle rule.</span></div>' },
    "suspended-delete": { line: "Versioning is suspended: the null version is gone, the old versions still sit there and bill.", html: "" },
    "hard-delete": { line: "Gone for real. Data loss is deletes, not disks.",
      html: '<div class="eyebrow">Durability vs. deletes</div><h3>Gone for real</h3><p>Without versioning the bytes vanish in one call. S3\'s 11 nines protect you from disks and AZs, not from yourself: real data loss is deletes and overwrites.</p><div class="fact"><b>Exam tip</b><span>"Recover an accidentally deleted object" → versioning (plus MFA Delete for the paranoid).</span></div>' },
    "bpa-blocked": { line: "403: Block Public Access rejected the public ACL.",
      html: '<div class="eyebrow">Block Public Access</div><h3>The request bounced, on purpose</h3><p>Block Public Access sits above every ACL and bucket policy. With <span class="mono">BlockPublicAcls</span> on, a public ACL is rejected with 403; with <span class="mono">IgnorePublicAcls</span> any existing one is ignored. It exists at account level and bucket level, and is on by default.</p><div class="fact"><b>Exam tip</b><span>"No bucket in the company may ever be public" → account-level BPA plus an SCP so nobody can switch it off.</span></div>' },
    "public-ok": { line: "Public. Anyone on the internet can read this key, no credentials.",
      html: '<div class="eyebrow">Public access</div><h3>Now anyone can read it</h3><p>With BPA off the ACL works and the key is readable by the whole internet. New buckets have ACLs disabled by default (Object Ownership: bucket owner enforced), so the modern way to go public is a bucket policy, and the right way for a website is CloudFront + Origin Access Control over a <b>private</b> bucket.</p><div class="fact"><b>Exam tip</b><span>Static site with HTTPS and a private bucket → CloudFront + OAC, not the HTTP-only website endpoint.</span></div>' },
    "object-lock": { line: "Object Lock (compliance): nobody, not even root, can delete this version until the retention date.",
      html: '<div class="eyebrow">Object Lock</div><h3>Compliance mode: nobody deletes</h3><p>Object Lock is write-once-read-many per object <b>version</b>. In compliance mode not even the root user can delete it or shorten the retention until the date passes. Governance mode lets special admins override; a legal hold is the same lock with no end date. A plain DELETE may still add a delete marker, the version underneath is untouchable.</p><div class="fact"><b>Exam tip</b><span>"Undeletable by anyone including root for 7 years" → compliance mode. Needs versioning; once on it can\'t be turned off.</span></div>' },
    "presign": { line: "Signed by the backend\'s credentials. Max 7 days.",
      html: '<div class="eyebrow">Presigned URL</div><h3>A signed permission slip</h3><p>Your backend signs a URL with its own credentials; whoever holds it can do that one action until <span class="mono">X-Amz-Expires</span> runs out. Signing is local math, no API call. Max <b>7 days</b>, and never longer than the signer\'s credentials: a role session expires sooner.</p><div class="fact"><b>Exam tip</b><span>"Temporary upload/download without AWS credentials" → presigned URL. "Valid 30 days" → it can\'t; regenerate, or use CloudFront signed URLs.</span></div>' },
    "multipart": { line: "Single PUT max 5 GB; multipart required above, recommended above 100 MB.",
      html: '<div class="eyebrow">Multipart upload</div><h3>Big objects go up in parts</h3><p>A single PUT tops out at <b>5 GB</b>; above that multipart is required, and recommended from 100 MB: parts upload in parallel and retry one at a time. Parts of an unfinished upload bill until you abort them.</p><div class="fact"><b>Exam tip</b><span>Every bucket wants an "abort incomplete multipart upload" lifecycle rule. "Large uploads fail on bad networks" → multipart.</span></div>' },
    "durability": { line: "11 nines: data is copied across ≥ 3 AZs. Availability is a separate 99.99 % promise.",
      html: '<div class="eyebrow">Durability</div><h3>11 nines</h3><p>S3 Standard copies every object across at least <b>3 Availability Zones</b> before answering 200. Lose a whole AZ and reads keep working. Availability is a separate, lower promise (99.99 %): the two numbers answer different questions.</p><div class="fact"><b>Exam tip</b><span>One Zone-IA lives in one AZ: lose it, lose the data. Only for copies you can rebuild.</span></div>' },
    "lifecycle": { line: "Age moves objects down the shelves: IA at 30 d, Glacier at 90 d, Deep Archive at 180 d.",
      html: '<div class="eyebrow">Lifecycle</div><h3>Age moves objects down the shelves</h3><p>A lifecycle rule runs about once a day and transitions objects by age. IA needs <b>30 days</b> in Standard first, Glacier Flexible <b>90</b>, Deep Archive <b>180</b>, and those are also the minimum days you pay for. IA classes bill at least 128 KB per object, so tiny files cost more there, not less.</p><div class="fact"><b>Exam tip</b><span>Unpredictable access → Intelligent-Tiering, which moves objects for you with no retrieval fee.</span></div>' },
    "overwrite": { line: "Last writer wins. The old bytes are gone.",

    vlistEl.hidden = !vlistEl.hidden; chipV.classList.toggle("on", !vlistEl.hidden);
    chipV.textContent = vlistEl.hidden ? "Show versions" : "Hide versions"; renderVersions(); tick();
  };
  Object.keys(toggles).forEach(function (k) { toggles[k].onclick = function () { setToggle(k); }; });
  dayEl.addEventListener("input", function () {
    S.day = +dayEl.value; dayVal.textContent = "Day " + S.day;
    var moved = applyLifecycle();
    if (moved.length) { tick(); logMoves(moved); if (!S.seen.lifecycle) lesson("lifecycle"); }
    else if (!S.lifecycle && S.day >= 30 && !S.seen["no-lifecycle"] && S.objects.length) { S.seen["no-lifecycle"] = 1; toast(SHEETS["no-lifecycle"].line, "lifecycle", "warn"); }
    render();
  });
  window.addEventListener("resize", placeToast);

  reset();
})();
</script>
</body>
