name: Deploy course to GitHub Pages

# Pages serves from the gh-pages branch (auto-enabled when that branch was
# first pushed). This workflow validates content, then syncs gh-pages to the
# course branch so every push goes live automatically.

on:
  push:
    branches: ["claude/session-d4r5gk", "main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate course content
        run: node tools/validate.js
      - name: Publish to gh-pages
        run: git push --force origin HEAD:gh-pages
