<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architect mode: fill the gap — Futureproof LAB</title>
<link rel="stylesheet" href="../kit.css">
<style>
  .wrap { max-width: 560px; }

  /* ---------- progress strip ---------- */
  .strip { display: flex; align-items: center; gap: 14px; padding: 6px 2px 10px; }
  .segs { flex: 1; display: flex; gap: 6px; }
  .seg { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; }
  .seg::after { content: ""; position: absolute; inset: 0; border-radius: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease-out), background .3s, opacity .3s; }
  .seg.cur::after { transform: scaleX(1); opacity: .6; }
  .seg.done::after { transform: scaleX(1); background: var(--ok); opacity: 1; }
  .readout { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
  .readout b { color: var(--ink); font-weight: 600; }

  /* ---------- scenario card ---------- */
  .scen { padding: 12px 14px; }
  .scen .k { display: flex; justify-content: space-between; }
  .scen .k span { color: var(--accent); }
  .scen p { color: var(--ink); font-size: 15px; line-height: 1.4; margin-top: 5px; font-weight: 500; }

  /* ---------- diagram ---------- */
  .diagram { margin-top: 10px; position: relative; transition: opacity .25s, transform .25s; }
  .diagram.swap { opacity: 0; transform: translateY(6px); }
  .diagram svg { display: block; width: 100%; height: auto; max-height: 300px; overflow: visible; }
  .nd rect.box { fill: rgba(22,27,37,0.92); stroke: var(--line-strong); stroke-width: 1; }
  .nd text.l { font-family: var(--display); font-size: 11.5px; font-weight: 600; fill: var(--ink); }
  .nd text.s { font-family: var(--mono); font-size: 8.8px; fill: var(--ink-dim); }
  .nd.zone rect.box { fill: rgba(255,255,255,0.02); stroke: var(--line); stroke-dasharray: 4 4; }
  .nd.zone text.l { font-family: var(--mono); font-size: 8.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; fill: var(--ink-dim); }
  .nd.warn rect.box { stroke: rgba(245,192,84,0.55); }
  .nd.bad rect.box { stroke: rgba(255,107,107,0.5); }
  .nd, .ed { transition: opacity .7s; }
  .nd.off, .ed.off { opacity: .18; }
  .ed path.ln { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 1.5; }
  .ed.warn path.ln { stroke: rgba(245,192,84,0.65); }
  .ed.bad path.ln { stroke: rgba(255,107,107,0.55); stroke-dasharray: 3 4; }
  .ed.pend path.ln { stroke: var(--accent); stroke-dasharray: 3 5; opacity: .35; }
  .ed.drawn path.ln { stroke: rgba(90,209,255,0.5); transition: stroke-dashoffset .8s var(--ease-out), opacity .3s; }
  .ed text { font-family: var(--mono); font-size: 8.5px; fill: var(--ink-dim); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; transition: opacity .4s; }
  .ed.pend text { opacity: 0; }

  .slot { cursor: pointer; }
  .slot rect.halo { fill: none; stroke: var(--accent); stroke-width: 5; opacity: .25; animation: halo 1.5s var(--ease-in-out) infinite alternate; }
  @keyframes halo { from { opacity: .12; } to { opacity: .5; } }
  .slot rect.box { fill: rgba(255,138,61,0.06); stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; transition: fill .2s; }
  .slot text.q { font-family: var(--display); font-size: 18px; font-weight: 700; fill: var(--accent); transition: font-size .2s; }
  .slot text.s { font-family: var(--mono); font-size: 8.5px; fill: var(--accent-2); opacity: .85; }
  .slot.hover rect.halo { opacity: .95; animation: none; }
  .slot.hover rect.box { fill: rgba(255,138,61,0.2); }
  .slot.bad rect.box, .slot.bad rect.halo { stroke: var(--bad); animation: slotbad .55s var(--ease-out) both; }
  @keyframes slotbad { 0% { opacity: 1; } 100% { opacity: .3; } }
  .slot.filled rect.halo { stroke: var(--accent); animation: blink .7s var(--ease-out) both; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
  .slot.filled rect.box { stroke-dasharray: none; fill: rgba(255,138,61,0.16); }
  .slot.filled text.q { font-size: 11.5px; fill: var(--ink); transition: none; }
  .slot.filled text.s { fill: var(--ink-dim); }

  .pk { fill: var(--flow); stroke: var(--flow-glow); stroke-width: 3; opacity: 0; transition: opacity .5s; }
  .pk.warn { fill: var(--warn); stroke: rgba(245,192,84,0.35); }
  .pk.on { opacity: 1; }

  /* ---------- hand of cards ---------- */
  .hand { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 4px 0 2px; min-height: 100px; }
  .card {
    width: 78px; height: 92px; flex: none; padding: 8px 5px 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
    border-radius: 14px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none;
    will-change: transform; cursor: grab;
    transition: box-shadow .25s, border-color .25s, opacity .4s;
  }
  .card svg { width: 26px; height: 26px; color: var(--ink-2); }
  .card .n { font-family: var(--display); font-size: 12px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .card .t { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  .card.lift { box-shadow: 0 22px 44px -12px rgba(0,0,0,0.95), 0 0 0 1px var(--accent-glow); z-index: 5; cursor: grabbing; }
  .card.lift svg { color: var(--accent-2); }
  .card.sel { border-color: var(--accent-glow); box-shadow: 0 0 0 3px rgba(255,138,61,0.16); }
  .card.sel svg { color: var(--accent-2); }
  .card.tried { opacity: .35; pointer-events: none; }
  .card.gone { opacity: 0; pointer-events: none; }
  .card.enter { opacity: 0; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 14px; }
  .btn.primary:focus-visible { outline-color: rgba(255,255,255,0.7); }

  .note { min-height: 38px; margin-top: 6px; font-size: 12.5px; line-height: 1.35; color: var(--ink-dim); padding: 0 2px; transition: opacity .3s, transform .3s; }
  .note.hide { opacity: 0; transform: translateY(-4px); }
  .note.bad { color: var(--ink-2); }
  .note.bad b { color: var(--bad); }
  .note.sel b { color: var(--accent-2); }

  /* ---------- explanation tray (grows from the bottom) ---------- */
  .tray {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 560px; margin: 0 auto;
    background: var(--panel-solid); border: 1px solid var(--line-strong); border-bottom: 0;
    border-radius: 24px 24px 0 0; padding: 16px 18px calc(16px + var(--sa-bottom));
    transform: translateY(110%); transition: transform .6s var(--spring);
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,0.9);
  }
  .tray.show { transform: translateY(0); }
  .meter .vals { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
  .meter .from { font-family: var(--mono); font-size: 14px; color: var(--ink-dim); text-decoration: line-through; }
  .meter .arrow { color: var(--ink-dim); font-size: 13px; }
  .meter .v { font-family: var(--mono); font-weight: 600; font-size: 28px; letter-spacing: -0.02em; color: var(--ok); font-variant-numeric: tabular-nums; }
  .meter .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--warn); transform-origin: left; transition: transform 1.1s var(--ease-out), background .5s; }
  .bar i.good { background: var(--ok); }
  .why { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
  .why b { color: var(--accent-2); }
  .tray .actions { margin-top: 14px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .tray .actions .mono { font-size: 11px; color: var(--ink-dim); }
  .tray .btn { opacity: 0; transform: scale(.8); }
  .tray.ready .btn { animation: popin .5s var(--spring) both; }

  /* ---------- end screen ---------- */
  .end { text-align: center; padding-top: 28px; }
  .end .panel { padding: 26px 20px 22px; }
  .ring { width: 150px; height: 150px; margin: 12px auto 6px; display: block; }
  .ring circle.t { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; }
  .ring circle.p { fill: none; stroke: var(--ok); stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1.4s var(--ease-out); }
  .ring text { font-family: var(--mono); font-weight: 600; font-size: 30px; fill: var(--ink); text-anchor: middle; letter-spacing: -0.02em; }
  .end .line { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .end .best { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
  .end .btn { margin-top: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .slot rect.halo { animation: none; opacity: .4; }
  }
</style>
</head>
<body>
<main class="wrap" id="game">
  <section class="strip">
    <div class="segs" id="segs" aria-label="Progress"></div>
    <div class="readout mono" id="readout">acc <b id="acc">—</b> · streak <b id="streak">0</b></div>
  </section>

  <section class="panel pad scen rise" id="scen">
    <div class="k"><span id="scen-k">Scenario 1 / 6</span><em id="scen-tag" style="font-style:normal"></em></div>
    <p id="scen-text"></p>
  </section>

  <section class="diagram" id="diagram" aria-label="Architecture diagram"></section>

  <section class="hand" id="hand" aria-label="Service cards"></section>
  <div class="note" id="note" aria-live="polite"></div>
</main>

<section class="wrap end" id="end" hidden>
  <div class="panel popin">
    <div class="k">Run complete</div>
    <svg class="ring" viewBox="0 0 140 140" aria-hidden="true">
      <circle class="t" cx="70" cy="70" r="58"/>
      <circle class="p" id="ring" cx="70" cy="70" r="58"/>
      <text x="70" y="80" id="ring-text">6/6</text>
    </svg>
    <div class="line" id="end-line">6/6 · 0 retries</div>
    <div class="best" id="end-best"></div>
    <button class="btn primary" id="again">Play again (shuffled)</button>
  </div>
</section>

<div class="tray" id="tray" aria-live="polite">
  <div class="meter" id="meter"></div>
  <div class="why" id="why"></div>
  <div class="actions"><span class="mono" id="tray-count"></span><button class="btn primary" id="next">Next</button></div>
</div>

<script src="../kit.js"></script>
<script>
(function () {
  "use strict";
  LAB.topbar("Architect mode", "Fill the gap · 6 scenarios");

  /* ============================================================
     Service glyphs — simple geometry, stroke only (no logos).
     ============================================================ */
  var G = {
    gwep: '<rect x="3" y="7" width="18" height="10" rx="3"/><path d="M8 12h8M13.5 9.5 16 12l-2.5 2.5"/>',
    ifep: '<rect x="5" y="5" width="14" height="14" rx="3"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    natinst: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 10v9M3 14.5h18"/>',
    cdn: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-3.2 3.2-3.2 13.8 0 17M12 3.5c3.2 3.2 3.2 13.8 0 17"/>',
    multiaz: '<rect x="2" y="7" width="8" height="10" rx="2"/><rect x="14" y="7" width="8" height="10" rx="2"/><path d="M10 10.5h4M10 13.5h4"/>',
    replica: '<rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2" stroke-dasharray="2 2"/>',
    snapshot: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
    proxy: '<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',
    sns: '<circle cx="5" cy="12" r="2.3"/><path d="M7.3 12h4.2M11.5 12l5.5-6M11.5 12h5.5M11.5 12l5.5 6"/><circle cx="19" cy="6" r="1.8"/><circle cx="19" cy="12" r="1.8"/><circle cx="19" cy="18" r="1.8"/>',
    sqs: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 12h2M11 12h2M15 12h2"/>',
    kinesis: '<path d="M3 7c3-3 6 3 9 0s6 3 9 0M3 13c3-3 6 3 9 0s6 3 9 0M3 19c3-3 6 3 9 0s6 3 9 0"/>',
    sched: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v4l2.5 1.5"/>',
    bucket: '<path d="M5 6h14l-1.5 13h-11z"/><path d="M5 6c0 2.2 14 2.2 14 0"/>',
    alb: '<path d="M12 4l8 8-8 8-8-8z"/><path d="M12 8v8M8 12h8"/>',
    ga: '<circle cx="12" cy="12" r="8.5"/><path d="M12 6.5l3.2 7-3.2-1.6-3.2 1.6z"/>',
    ondemand: '<path d="M13 3 5 14h6l-1 7 9-11h-6z"/>',
    prov: '<path d="M4 20v-8h4v8M10 20V6h4v14M16 20v-5h4v5M3 20h18"/><path d="M3 4h18" stroke-dasharray="2 2"/>',
    dax: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M13 7l-4 5.5h4L12 17l4-5.5h-4z"/>',
    global: '<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M11 10.5h2M11 13.5h2"/>',
    savings: '<path d="M3 12 12 3h9v9l-9 9z"/><circle cx="16" cy="8" r="1.4"/><path d="M8 16l5-5"/>',
    spot: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2.5"/>',
    host: '<rect x="3" y="3" width="18" height="18" rx="3"/><rect x="6.5" y="6.5" width="4.5" height="4.5"/><rect x="13" y="6.5" width="4.5" height="4.5"/><rect x="6.5" y="13" width="4.5" height="4.5"/><rect x="13" y="13" width="4.5" height="4.5"/>',
    bigger: '<rect x="3" y="13" width="6" height="6" rx="1.5"/><rect x="11" y="5" width="10" height="14" rx="2"/><path d="M9 16h2"/>'
  };
  function glyph(k) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + G[k] + '</svg>';
  }

  /* ============================================================
     Scenarios. Diagram space is 360 × 260.
     node: {id,x,y,w,h,label,sub,zone,tone,phase,after:{label,sub}}
     edge: {from,to,phase:"before"|"after"|"both",flow,tone,label}
     meter: {label,from,to,fmt,dir,sub,toText,fromText}
     ============================================================ */
  var money = function (n) { return "$" + Math.round(n).toLocaleString(); };
  var SC = [
    {
      tag: "cost",
      text: "A private-subnet app reads 20 TB a month from S3 through a NAT gateway. Cut the bill without touching the code.",
      slot: { x: 124, y: 186, w: 96, h: 44, hint: "route to S3" },
      nodes: [
        { id: "vpc", x: 8, y: 12, w: 226, h: 240, zone: true, label: "VPC" },
        { id: "app", x: 24, y: 108, w: 92, h: 44, label: "App", sub: "private subnet" },
        { id: "nat", x: 124, y: 30, w: 96, h: 44, label: "NAT gateway", sub: "$0.045 / GB", tone: "warn", phase: "before" },
        { id: "inet", x: 254, y: 30, w: 92, h: 44, label: "Internet", phase: "before" },
        { id: "s3", x: 254, y: 108, w: 92, h: 44, label: "S3 bucket", sub: "20 TB / month" }
      ],
      edges: [
        { from: "app", to: "nat", phase: "before", flow: true, tone: "warn" },
        { from: "nat", to: "inet", phase: "before", flow: true, tone: "warn" },
        { from: "inet", to: "s3", phase: "before", flow: true, tone: "warn" },
        { from: "app", to: "slot", phase: "after", flow: true },
        { from: "slot", to: "s3", phase: "after", flow: true, label: "route table · free" }
      ],
      cards: [
        { id: "gwep", name: "Gateway endpoint", short: "Gateway endpoint", tag: "free", right: true },
        { id: "ifep", name: "Interface endpoint", tag: "hourly + GB", why: "Works, but PrivateLink bills per hour per AZ plus per GB; the gateway endpoint for S3 is free." },
        { id: "natinst", name: "NAT instance", tag: "you manage", why: "Cheaper per hour than a NAT gateway, but every one of those 20 TB still flows through a box you now patch and size." },
        { id: "cdn", name: "CloudFront", tag: "edge cache", why: "A CDN for the public edge. This app sits in a private subnet reading from S3; nobody is serving users here." }
      ],
      why: "A gateway endpoint is a route-table entry for S3: free, no per-GB charge, and the traffic never leaves the AWS network.",
      meter: { label: "NAT data processing · per month", from: 922, to: 0, fmt: money, dir: "down", fromText: "≈ $922", sub: "20,480 GB × $0.045 / GB → $0" }
    },
    {
      tag: "availability",
      text: "One RDS MySQL instance in a single AZ runs checkout. An AZ outage must not stop orders: automatic failover, no app changes.",
      slot: { x: 220, y: 160, w: 100, h: 48, hint: "standby" },
      nodes: [
        { id: "app", x: 132, y: 16, w: 96, h: 44, label: "App", sub: "writes + reads" },
        { id: "aza", x: 8, y: 100, w: 164, h: 150, zone: true, label: "AZ a" },
        { id: "azb", x: 188, y: 100, w: 164, h: 150, zone: true, label: "AZ b" },
        { id: "db", x: 40, y: 160, w: 100, h: 48, label: "RDS primary", sub: "MySQL" }
      ],
      edges: [
        { from: "app", to: "db", phase: "both", flow: true },
        { from: "db", to: "slot", phase: "after", flow: true, label: "synchronous" }
      ],
      cards: [
        { id: "multiaz", name: "Multi-AZ", short: "Multi-AZ standby", tag: "standby", right: true },
        { id: "replica", name: "Read replica", tag: "async", why: "Asynchronous and readable, but failover is a manual promotion and the newest writes can be lost." },
        { id: "snapshot", name: "Snapshots", tag: "daily", why: "A restore creates a new instance in tens of minutes and loses every write since the snapshot." },
        { id: "proxy", name: "RDS Proxy", tag: "conn pool", why: "Pools connections and makes a failover faster, but there is no standby to fail over to." }
      ],
      why: "Multi-AZ keeps a synchronous standby in another AZ and flips the DNS endpoint to it in about 60–120 s. The standby is never readable; it is for staying up, not for reads.",
      meter: { label: "Recovery after an AZ failure", from: 1800, to: 90, fmt: function (n) { return n >= 600 ? "≈ " + Math.round(n / 60) + " min" : "≈ " + Math.round(n) + " s"; }, dir: "down", fromText: "manual · 30 min+", toText: "≈ 60–120 s", sub: "automatic DNS failover · zero lost writes" }
    },
    {
      tag: "decoupling",
      text: "Every new order must reach billing, email and analytics, each reliably, each at its own pace. One publish, three independent consumers.",
      slot: { x: 132, y: 108, w: 96, h: 44, hint: "fan-out" },
      nodes: [
        { id: "orders", x: 12, y: 108, w: 92, h: 44, label: "Order service", sub: "1 event" },
        { id: "q1", x: 256, y: 30, w: 92, h: 44, label: "Billing", sub: "SQS queue" },
        { id: "q2", x: 256, y: 108, w: 92, h: 44, label: "Email", sub: "SQS queue" },
        { id: "q3", x: 256, y: 186, w: 92, h: 44, label: "Analytics", sub: "SQS queue" }
      ],
      edges: [
        { from: "orders", to: "slot", phase: "after", flow: true },
        { from: "slot", to: "q1", phase: "after", flow: true },
        { from: "slot", to: "q2", phase: "after", flow: true },
        { from: "slot", to: "q3", phase: "after", flow: true }
      ],
      cards: [
        { id: "sns", name: "SNS topic", short: "SNS topic", tag: "pub/sub", right: true },
        { id: "sqs", name: "SQS alone", tag: "one queue", why: "One queue, one consumer takes each message; the other two never see it." },
        { id: "kinesis", name: "Kinesis stream", tag: "shards", why: "Built for streams with many readers, but needs shard cursors and checkpointing: heavy for 'notify three services'." },
        { id: "sched", name: "EventBridge Scheduler", tag: "cron", why: "Fires on a timetable, not when an order happens." }
      ],
      why: "SNS fan-out: one publish, a copy lands in every subscribed SQS queue. Each consumer keeps its own backlog and its own retries.",
      meter: { label: "Copies delivered per order event", from: 1, to: 3, fmt: function (n) { return Math.round(n) + " queues"; }, dir: "up", fromText: "1 queue", sub: "SNS → SQS: one queue per consumer, filter policies optional" }
    },
    {
      tag: "edge + security",
      text: "A static site lives in a private S3 bucket. Serve it over HTTPS on your own domain, fast worldwide, and keep the bucket private.",
      slot: { x: 132, y: 108, w: 96, h: 44, hint: "edge" },
      nodes: [
        { id: "users", x: 12, y: 108, w: 92, h: 44, label: "Users", sub: "worldwide" },
        { id: "acm", x: 132, y: 22, w: 96, h: 40, label: "ACM certificate", sub: "your domain" },
        { id: "s3", x: 256, y: 108, w: 92, h: 44, label: "S3 bucket", sub: "private · BPA on" },
        { id: "direct", x: 12, y: 196, w: 92, h: 44, label: "Direct URL", sub: "anyone", tone: "bad" }
      ],

    $("meter").innerHTML = '<div class="k">' + LAB.esc(m.label) + '</div>' +
      '<div class="vals"><span class="from">' + LAB.esc(m.fromText || m.fmt(m.from)) + '</span><span class="arrow">→</span><span class="v"></span></div>' +
      '<div class="sub">' + LAB.esc(m.sub || "") + '</div><div class="bar"><i></i></div>';
    var v = $("meter").querySelector(".v"), bar = $("meter").querySelector(".bar i");
    v.textContent = m.fmt(m.from);
    var r0 = bad ? 1 : m.from / m.to, r1 = bad ? m.to / m.from : 1;
    bar.style.transform = "scaleX(" + r0 + ")";
    $("why").innerHTML = "<b>Why</b> " + LAB.esc(cur.why);
    $("tray-count").textContent = (state.idx + 1) + " / 6";
    $("next").textContent = state.idx === 5 ? "Finish" : "Next";
    tray.classList.remove("ready"); tray.classList.add("show");
    setTimeout(function () {
      LAB.count(v, m.to, { from: m.from, fmt: m.fmt, ms: 1200 });
      bar.style.transform = "scaleX(" + Math.max(r1, 0.012) + ")"; bar.classList.add("good");
      if (m.toText) setTimeout(function () { v.textContent = m.toText; }, 1250);
    }, 380);
    setTimeout(function () { tray.classList.add("ready"); if (usingKeyboard) $("next").focus({ preventScroll: true }); }, 1300);
  }
  $("next").addEventListener("click", function () {
    tray.classList.remove("show", "ready"); LAB.haptic("tap"); LAB.sound.play("tap");
    setTimeout(function () { state.idx++; if (state.idx >= 6) finish(); else render(); }, 260);
  });

  /* ============================================================
     Scenario render / end screen
     ============================================================ */
  function render() {
    cur = SC[state.order[state.idx]];
    state.locked = false; state.wrongRound = false; hovering = false; clearPackets();
    paintSegs();
    $("scen-k").textContent = "Scenario " + (state.idx + 1) + " / 6"; $("scen-tag").textContent = cur.tag;
    var sp = $("scen-text"); sp.textContent = cur.text;
    var scen = $("scen"); scen.classList.remove("rise"); void scen.offsetWidth; scen.classList.add("rise");
    diagEl.classList.add("swap");
    setTimeout(function () { renderDiagram(cur); diagEl.classList.remove("swap"); }, 120);
    renderHand(cur); hint();
  }
  function finish() {
    $("game").hidden = true; var end = $("end"); end.hidden = false;
    var ring = $("ring"), C = 2 * Math.PI * 58;
    ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C;
    $("ring-text").textContent = state.correct + "/6";
    $("end-line").textContent = state.correct + "/6 · " + state.retries + (state.retries === 1 ? " retry" : " retries") + " · first try " + state.firstTry + "/6";
    var best = null; try { best = JSON.parse(localStorage.getItem("lab-architect") || "null"); } catch (e) {}
    if (!best || state.retries < best.retries || (state.retries === best.retries && state.firstTry > best.firstTry)) {
      best = { retries: state.retries, firstTry: state.firstTry, at: Date.now() };
      try { localStorage.setItem("lab-architect", JSON.stringify(best)); } catch (e) {}
      $("end-best").textContent = "New best run";
    } else $("end-best").textContent = "Best run · 6/6 · " + best.retries + (best.retries === 1 ? " retry" : " retries");
    requestAnimationFrame(function () { requestAnimationFrame(function () { ring.style.strokeDashoffset = C * (1 - state.correct / 6); }); });
    LAB.haptic("ok"); LAB.sound.play("ok");
    window.scrollTo(0, 0);
  }
  $("again").addEventListener("click", function () {
    state.order = shuffle([0, 1, 2, 3, 4, 5]); state.idx = 0; state.correct = 0; state.retries = 0; state.streak = 0; state.firstTry = 0;
    $("acc").textContent = "—"; $("streak").textContent = "0";
    $("end").hidden = true; $("game").hidden = false; render(); LAB.haptic("tap"); LAB.sound.play("tap");
  });

  render();
})();
</script>
</body>
</html>
