<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Constellation — Futureproof LAB</title>
<link rel="stylesheet" href="../kit.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { position: fixed; inset: 0; }
  body::before { background: var(--bg); }           /* the star field replaces the dot grid */
  #map { position: fixed; inset: 0; z-index: 0; touch-action: none; cursor: grab; }
  #map.drag { cursor: grabbing; }
  .lab-top { position: fixed; left: 0; right: 0; top: 0; }

  /* ---- domain ring strip ---- */
  .rings {
    position: fixed; top: calc(58px + var(--sa-top)); left: 0; right: 0; z-index: 15;
    display: flex; justify-content: center; gap: 4px; padding: 4px 8px 10px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(11,14,20,0.55), transparent);
  }
  .ring {
    pointer-events: auto; width: 58px; min-height: 64px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; border-radius: 14px; padding: 5px 0 4px;
    transition: transform .35s var(--spring), background .2s;
  }
  .ring:active { transform: scale(.92); }
  .ring.on { background: rgba(255,255,255,.06); }
  .ring .ico { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; width: 40px; height: 40px; transform: rotate(-90deg); }
  .ring .bg { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 3; }
  .ring .fg { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .7s var(--ease-out); }
  .ring .n { position: relative; font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ring .lbl { font-size: 10px; color: var(--ink-dim); letter-spacing: .03em; }

  /* ---- bottom strip ---- */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 26px 16px calc(14px + var(--sa-bottom));
    background: linear-gradient(to top, rgba(11,14,20,0.97) 42%, transparent);
  }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-dim); vertical-align: -1px; margin-right: 5px; }
  .legend i.m { background: var(--ink-2); border-color: var(--ink-2); box-shadow: 0 0 8px rgba(255,255,255,.35); }
  .legend i.p { background: linear-gradient(to top, var(--ink-2) 50%, transparent 50%); border-color: var(--ink-2); }
  .legend i.f { border-color: var(--ink-2); }
  .legend i.l { border-style: dotted; }
  .pillrow { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 18px 0 14px;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--line-strong); text-align: left;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px -16px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05) inset;
    transition: transform .35s var(--spring), border-color .2s;
  }
  .pill:active { transform: scale(.96); }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 12px var(--c, var(--accent)); flex: none; }
  .pill .k { display: block; line-height: 1.2; }
  .pill b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .pill .arr { color: var(--ink-dim); flex: none; }
  .btn.ghost.sm.reset { color: var(--ink-dim); border-color: var(--line); }

  /* ---- sheet extras ---- */
  .lvl { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; font-size: 14px; }
  .lvl .bar { display: flex; gap: 4px; }
  .lvl .bar i { width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); transition: background .3s; }
  .lvl .bar i.on { background: var(--c); box-shadow: 0 0 10px var(--c); }
  .sheet p.needs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; margin: 10px 0 0; }
  .need { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12.5px; color: var(--ink-dim); }
  .need.ok { color: var(--ok); border-color: rgba(74,222,128,.35); }
  .sheet .fact span { color: var(--ink-2); }
  .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .acts .btn { width: 100%; }
  .acts .btn.ghost.sm { width: auto; align-self: center; color: var(--ink-dim); margin-top: 2px; }
</style>
</head>
<body>
<canvas id="map" class="full" aria-label="Constellation map of the course"></canvas>
<script src="../kit.js"></script>
<script>
(function () {
  "use strict";
  var TAU = Math.PI * 2, reduced = LAB.reducedMotion;
  LAB.topbar("Constellation", "Your cloud, lit as you learn");

  /* =============================== DATA =============================== */
  var DOMAINS = [
    { id: "fnd", name: "Foundations & IAM",  short: "Core",    color: "#ff8a3d" },
    { id: "net", name: "Networking",         short: "Network", color: "#5ad1ff" },
    { id: "cmp", name: "Compute",            short: "Compute", color: "#b69cff" },
    { id: "sto", name: "Storage & Databases",short: "Storage", color: "#4ade80" },
    { id: "int", name: "Integration & Data", short: "Data",    color: "#f5c054" },
    { id: "ops", name: "Ops & Security",     short: "Ops",     color: "#ff7a9a" }
  ];
  var DOM = {}; DOMAINS.forEach(function (d) { DOM[d.id] = d; });

  /* id · short label · course title · domain · prerequisites · exam weight 1–3 · one-line why */
  var MODULES = [
    ["foundations", "Foundations", "Cloud Architecture Foundations", "fnd", [], 1, "Regions, AZs, the Well-Architected pillars and how the exam scores: 720/1000, compensatory, no per-domain pass."],
    ["iam", "IAM", "IAM, STS & Organizations", "fnd", ["foundations"], 3, "Nothing is allowed until a policy says so, and an explicit deny always wins. Roles, not long-lived keys."],
    ["vpc", "VPC", "VPC & Core Networking", "net", ["foundations"], 3, "Your private network: subnets per AZ, route tables decide where traffic may go, security groups are stateful, NACLs are not."],
    ["ec2", "EC2", "EC2 & Compute Fundamentals", "cmp", ["vpc"], 2, "Instance families, On-Demand vs Reserved vs Spot (≈ up to 90% off, can be reclaimed), placement groups and user data."],
    ["elb-asg", "ELB & ASG", "Load Balancing & Auto Scaling", "net", ["ec2"], 3, "ALB routes by HTTP, NLB by TCP at millions of requests/s; an Auto Scaling group replaces unhealthy instances across AZs."],
    ["s3", "S3", "S3 Deep Dive", "sto", ["iam"], 3, "Eleven nines of durability, storage classes by access pattern, lifecycle rules, bucket policies and versioning."],
    ["block-file", "EBS & EFS", "EBS, EFS, FSx & Storage Gateway", "sto", ["ec2"], 2, "EBS lives in one AZ and attaches to one instance; EFS is shared across AZs; FSx for Windows and for Lustre."],
    ["rds-aurora", "RDS & Aurora", "RDS & Aurora", "sto", ["vpc"], 2, "Multi-AZ is for failover, read replicas are for read scale. Aurora keeps 6 copies across 3 AZs."],
    ["dynamodb", "DynamoDB", "DynamoDB Deep Dive", "sto", ["iam"], 2, "Single-digit-millisecond reads at any scale; the partition key design decides whether it works."],
    ["caching", "Caching", "Caching: ElastiCache, DAX & CloudFront", "sto", ["rds-aurora"], 2, "Redis vs Memcached, DAX in front of DynamoDB, CloudFront at the edge for everything static."],
    ["route53", "Route 53", "Route 53 & DNS Architecture", "net", ["vpc"], 2, "Alias records at the apex, a routing policy per scenario verb, health checks that drive failover."],
    ["serverless", "Lambda", "Serverless: Lambda, API Gateway & Step Functions", "cmp", ["iam", "s3"], 2, "15-minute maximum, up to 10 GB memory, scales per request; Step Functions orchestrate the workflow."],
    ["messaging", "Messaging", "Messaging & Streaming: SQS, SNS, EventBridge & Kinesis", "int", ["serverless"], 2, "Decouple with queues, fan out with topics, route events with EventBridge, stream with shards."],
    ["containers", "Containers", "Containers: ECS, EKS & Fargate", "cmp", ["ec2", "elb-asg"], 1, "ECS is AWS-native, EKS is Kubernetes, Fargate removes the servers from both."],
    ["security-services", "Security", "Security Services: KMS, WAF & Friends", "ops", ["iam", "vpc"], 3, "KMS keys and envelope encryption, WAF rules, Shield for DDoS, GuardDuty findings, Secrets Manager rotation."],
    ["observability", "Observability", "Observability: CloudWatch, CloudTrail, X-Ray & Config", "ops", ["ec2"], 2, "CloudWatch sees metrics and logs, CloudTrail sees API calls, X-Ray sees traces, Config sees drift."],
    ["analytics", "Analytics", "Analytics & Data Lakes", "int", ["s3"], 1, "Athena queries S3 in place, Glue catalogs and transforms, Redshift warehouses, QuickSight shows it."],
    ["migration", "Migration", "Migration & Data Transfer", "int", ["s3", "block-file"], 2, "DMS for databases, the Snow family for petabytes, DataSync for files, Transfer Family for SFTP."],
    ["cost", "Cost", "Cost Optimization & Billing", "ops", ["ec2", "s3"], 2, "Savings Plans and Spot, right-sizing, S3 Intelligent-Tiering, Budgets and Cost Explorer."],
    ["ha-dr", "HA & DR", "High Availability & Disaster Recovery", "ops", ["elb-asg", "rds-aurora"], 3, "Backup & restore → pilot light → warm standby → multi-site active-active, chosen by RTO and RPO."],
    ["multi-account", "Organizations", "Multi-Account Strategy & Governance (Pro)", "ops", ["iam", "security-services"], 1, "SCPs set the ceiling, Control Tower lands accounts, consolidated billing shares the discounts."],
    ["adv-networking", "Hybrid network", "Advanced & Hybrid Networking (Pro)", "net", ["vpc", "route53"], 1, "Direct Connect, Site-to-Site VPN, Transit Gateway hub-and-spoke, PrivateLink at scale."],
    ["devops-iac", "IaC & DevOps", "IaC, Deployment & Operations at Scale (Pro)", "ops", ["observability", "containers"], 1, "CloudFormation and CDK, CodePipeline, blue/green and canary deployments, Systems Manager."],
    ["migration-pro", "Migration (Pro)", "Large-Scale Migration & Modernization (Pro)", "int", ["migration", "adv-networking"], 1, "The 7 Rs, wave planning, Migration Hub, mainframe and database modernization."],
    ["pro-scenarios", "Pro scenarios", "Professional Scenario Walkthroughs", "ops", ["ha-dr", "multi-account"], 1, "Full-length SAP-C02 scenarios solved end to end, the way the examiner reads them."],
    ["ai-ml", "AI & ML", "AI & ML on AWS", "int", ["analytics", "serverless"], 1, "Bedrock, SageMaker, Rekognition, Comprehend: pick the managed service, not the model."]
  ].map(function (r, i) {
    return { i: i, id: r[0], label: r[1], title: r[2], domain: r[3], pre: r[4], w: r[5], why: r[6],
             mastery: 0, la: 0, a: 1, sweep: 1, pop: null, phase: i * 0.9, next: [], vis: false };
  });
  var byId = {}; MODULES.forEach(function (m) { byId[m.id] = m; });
  MODULES.forEach(function (m) { m.pre.forEach(function (p) { byId[p].next.push(m); }); });
  var EDGES = [];
  MODULES.forEach(function (m) { m.pre.forEach(function (p) { EDGES.push({ a: byId[p], b: m, len: 1, from: byId[p] }); }); });

  /* ------------------------------ layout ------------------------------ */
  var CLUSTER = { fnd: { x: 0, y: 0 }, net: { x: 0, y: -245 }, cmp: { x: 135, y: -85 },
                  sto: { x: 100, y: 200 }, int: { x: -100, y: 200 }, ops: { x: -135, y: -85 } };
  var RING_R = { 2: 36, 3: 50, 4: 58, 5: 64, 6: 66, 7: 66 };
  function seeded(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  DOMAINS.forEach(function (d) {
    var c = CLUSTER[d.id], arr = MODULES.filter(function (m) { return m.domain === d.id; }), n = arr.length;
    c.R = RING_R[n] || 70;
    var a0 = d.id === "fnd" ? -Math.PI / 3 : Math.atan2(c.y, c.x);
    arr.forEach(function (m, k) {
      var a = a0 + k * TAU / n;
      m.x = c.x + Math.cos(a) * c.R + (seeded(m.i) - 0.5) * 12;
      m.y = c.y + Math.sin(a) * c.R + (seeded(m.i + 50) - 0.5) * 12;
      var dx = m.x - c.x, dy = m.y - c.y, L = Math.hypot(dx, dy) || 1;
      m.dx = dx / L; m.dy = dy / L; m.cx = c.x; m.cy = c.y;
      /* nodes on the map's outer flank get a vertical label so nothing hangs off a phone edge */
      if (Math.abs(m.x) > 110 && m.dx * Math.sign(m.x) > 0.3) { m.dy = m.dy < 0 ? -1 : 1; m.dx = 0; }
    });
  });
  var EXT_X = 209, EXT_Y = 311;            /* world half-extents of the node field */

  /* ----------------------------- persistence ----------------------------- */
  var KEY = "lab-constellation";
  var DEMO = { foundations: 3, iam: 3, vpc: 3, ec2: 3, s3: 3, "elb-asg": 3, "block-file": 3,
               "rds-aurora": 2, dynamodb: 2, route53: 2, serverless: 2,
               caching: 1, "security-services": 1, observability: 1 };
  function load() {
    var src = DEMO;
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.mastery) src = d.mastery; } catch (e) {}
    MODULES.forEach(function (m) { m.mastery = LAB.clamp(src[m.id] | 0, 0, 3); });
  }
  function save() {
    var o = {}; MODULES.forEach(function (m) { o[m.id] = m.mastery; });
    try { localStorage.setItem(KEY, JSON.stringify({ mastery: o })); } catch (e) {}
  }

  /* ------------------------------ mastery logic ------------------------------ */
  var WORDS = ["Not started", "Familiar", "Proficient", "Mastered"];
  function unlocked(m) { for (var i = 0; i < m.pre.length; i++) if (byId[m.pre[i]].mastery < 2) return false; return true; }
  function state(m) { return m.mastery >= 3 ? "mastered" : unlocked(m) ? "frontier" : "locked"; }
  function edgeState(e) {
    var sa = state(e.a), sb = state(e.b);
    if (sa === "mastered" && sb === "mastered") return 2;
    if ((sa === "mastered" && sb === "frontier") || (sb === "mastered" && sa === "frontier")) return 1;
    return 0;
  }
  function bestNext() {
    var best = null, bs = -1e9;
    MODULES.forEach(function (m) {
      if (m.mastery >= 3) return;
      var missing = m.pre.filter(function (p) { return byId[p].mastery < 2; }).length;
      var sc = -missing * 10 + m.w * 2 + m.mastery;
      if (sc > bs) { bs = sc; best = m; }
    });
    return best;
  }

  /* =============================== CANVAS =============================== */
  var cv = document.getElementById("map"), C = LAB.canvas(cv), g = C.g;
  var W = 0, H = 0, NOW = 0, OFF_Y = 14;          /* map centre sits 14 px below screen centre (strip vs bottom) */
  var cam = { x: 0, y: 0, z: 1 }, MINZ = 0.6, MAXZ = 2.5, camTok = 0;
  var vel = { x: 0, y: 0 }, dragging = false;
  var ripples = [], glints = [], glintTimer = 0;
  var FONT = "500 11px Inter, system-ui, sans-serif", DFONT = "600 10px Sora, Inter, sans-serif";
  var hasLS = "letterSpacing" in g;

  var rgbCache = {};
  function hexA(hex, a) {
    var c = rgbCache[hex];
    if (!c) { c = rgbCache[hex] = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }
  function mod(a, n) { return ((a % n) + n) % n; }

  /* glow sprites, one per domain (drawn via drawImage, no per-frame shadowBlur) */
  var GLOW = {};
  DOMAINS.forEach(function (d) {
    var s = document.createElement("canvas"); s.width = s.height = 128;
    var x = s.getContext("2d"), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, hexA(d.color, 0.55)); gr.addColorStop(0.35, hexA(d.color, 0.2)); gr.addColorStop(1, hexA(d.color, 0));
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128); GLOW[d.id] = s;
  });

  /* static star field, drawn once to an offscreen canvas, tiled with 0.3× parallax */
  var stars = null;
  function buildStars(w, h) {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    stars = document.createElement("canvas"); stars.width = Math.round(w * dpr); stars.height = Math.round(h * dpr);
    var x = stars.getContext("2d"); x.scale(dpr, dpr);
    var n = Math.round(w * h / 1700);
    for (var i = 0; i < n; i++) {
      var r = 0.35 + Math.random() * Math.random() * 1.1, a = 0.12 + Math.random() * 0.5, t = Math.random();
      x.fillStyle = t < 0.15 ? "rgba(180,210,255," + a + ")" : t < 0.25 ? "rgba(255,220,190," + a + ")" : "rgba(235,240,250," + a + ")";
      x.beginPath(); x.arc(Math.random() * w, Math.random() * h, r, 0, TAU); x.fill();
    }
  }

  /* label widths cached once (re-measured when Inter arrives) */
  var LW = {};
  function measure() { g.font = FONT; MODULES.forEach(function (m) { LW[m.id] = g.measureText(m.label).width; }); }
  measure();
  if (document.fonts && document.fonts.load) document.fonts.load(FONT).then(measure, function () {});

  /* ------------------------------ assembly ------------------------------ */
  var order = MODULES.slice();
  function assemble() {
    MODULES.forEach(function (m, i) {
      var ang = Math.random() * TAU, d = 90 + Math.random() * 130;
      m.sx = LAB.spring(m.x + Math.cos(ang) * d, { stiffness: 80, damping: 11 });
      m.sy = LAB.spring(m.y + Math.sin(ang) * d, { stiffness: 80, damping: 11 });
      m.a = 0; m.la = 0; m.pop = null; m.sweep = 1;
      setTimeout(function () {
        m.sx.set(m.x); m.sy.set(m.y);
        LAB.tween(500, function (t) { m.a = t; }, LAB.ease.outCubic);
      }, reduced ? 0 : 100 + i * 28);
    });
    EDGES.forEach(function (e) { e.len = 0; e.from = e.a; });
    setTimeout(function () {
      var k = 0;
      EDGES.forEach(function (e) {
        if (edgeState(e) === 2) { setTimeout(function () { LAB.tween(450, function (t) { e.len = t; }, LAB.ease.outCubic); }, k * 70); k++; }
        else e.len = 1;
      });
    }, reduced ? 0 : 1300);
  }

  /* ------------------------------ camera ------------------------------ */
  function fitZoom() {
    return Math.min((W / 2 - 30) / EXT_X, ((H - 228) / 2 - 30) / EXT_Y);
  }
  function flyTo(wx, wy, z, ms, done) {
    var tok = ++camTok, x0 = cam.x, y0 = cam.y, z0 = cam.z; vel.x = vel.y = 0;
    z = LAB.clamp(z, MINZ, MAXZ);
    LAB.tween(ms || 600, function (t) {
      if (tok !== camTok) return;
      cam.z = LAB.lerp(z0, z, t); cam.x = LAB.lerp(x0, wx, t); cam.y = LAB.lerp(y0, wy - OFF_Y / cam.z, t);
    }, LAB.ease.outExpo, function () { if (tok === camTok && done) done(); });
  }
  function flyToCluster(d) {
    var c = CLUSTER[d.id], free = Math.min(W, H - 228);
    var z = LAB.clamp((free / 2 - 70) / c.R, 0.8, 1.8);
    DOMAINS.forEach(function (x) { x.el.classList.toggle("on", x === d); });
    flyTo(c.x, c.y, z, 600);
    LAB.haptic("tap"); LAB.sound.play("whoosh");
  }
  function flyToNode(m) {
    flyTo(m.x, m.y, Math.max(cam.z, 1.5), 700, function () {
      pulse(m); setTimeout(function () { pulse(m); }, 260);
    });
    LAB.haptic("tap"); LAB.sound.play("whoosh");
  }
  function pulse(m) { ripples.push({ m: m, t0: NOW, col: DOM[m.domain].color }); }

  /* ------------------------------ drawing ------------------------------ */
  function fillLevel(lvl, sx, sy, r, col) {
    if (lvl >= 3) { g.fillStyle = col; g.beginPath(); g.arc(sx, sy, r, 0, TAU); g.fill(); }
    else if (lvl === 2) { g.fillStyle = hexA(col, 0.9); g.beginPath(); g.arc(sx, sy, r, 0, Math.PI); g.fill(); }
  }
  function drawBody(m, lvl, sx, sy, r, col) {
    if (m.sweep < 1) {
      fillLevel(lvl - 1, sx, sy, r, col);
      g.save(); g.beginPath(); g.moveTo(sx, sy); g.arc(sx, sy, r + 10, -Math.PI / 2, -Math.PI / 2 + TAU * m.sweep); g.closePath(); g.clip();
      fillLevel(lvl, sx, sy, r, col); g.restore();
    } else fillLevel(lvl, sx, sy, r, col);
  }

  function frame(dt, t) {
    var s = C.size(); NOW = t;
    if (s.w !== W || s.h !== H) {
      var first = !W; W = s.w; H = s.h; buildStars(W, H);
      if (first) { cam.z = fitZoom(); MINZ = Math.min(0.6, cam.z * 0.95); cam.x = 0; cam.y = -OFF_Y / cam.z; }
    }
    var z = cam.z, w = W, h = H, hw = w / 2, hh = h / 2;

    /* ---- physics ---- */
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i]; m.sx.step(dt); m.sy.step(dt);
      if (m.pop) { m.pop.step(dt); if (m.pop.settled()) m.pop = null; }
    }
    if (!dragging && (Math.abs(vel.x) > 2 || Math.abs(vel.y) > 2)) {
      cam.x -= vel.x * dt / z; cam.y -= vel.y * dt / z;
      var k = Math.exp(-dt * 5); vel.x *= k; vel.y *= k;
    }

    g.clearRect(0, 0, w, h);

    /* ---- stars, 0.3× parallax, tiled ---- */
    var ox = mod(-cam.x * 0.3 * z, w), oy = mod(-cam.y * 0.3 * z, h);
    g.drawImage(stars, ox - w, oy - h, w, h); g.drawImage(stars, ox, oy - h, w, h);
    g.drawImage(stars, ox - w, oy, w, h);     g.drawImage(stars, ox, oy, w, h);

    /* ---- cluster halos + domain names ---- */
    g.font = DFONT; g.textAlign = "center"; g.textBaseline = "middle"; g.lineWidth = 1;
    if (hasLS) g.letterSpacing = "0.14em";
    for (i = 0; i < DOMAINS.length; i++) {
      var d = DOMAINS[i], c = CLUSTER[d.id], cx = (c.x - cam.x) * z + hw, cy = (c.y - cam.y) * z + hh, rr = (c.R + 28) * z;
      if (cx + rr < 0 || cx - rr > w || cy + rr < 0 || cy - rr > h) continue;
      g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.strokeStyle = "rgba(255,255,255,0.045)"; g.stroke();
      g.fillStyle = hexA(d.color, 0.5);
      g.fillText(d.short.toUpperCase(), cx, d.id === "fnd" ? cy + (c.R + 42) * z : cy);
    }
    if (hasLS) g.letterSpacing = "0px";

    /* ---- constellation lines ---- */
    for (i = 0; i < EDGES.length; i++) {
      var e = EDGES[i], st = edgeState(e); if (!st) continue;
      var ax = (e.a.sx.value - cam.x) * z + hw, ay = (e.a.sy.value - cam.y) * z + hh;
      var bx = (e.b.sx.value - cam.x) * z + hw, by = (e.b.sy.value - cam.y) * z + hh;
      if ((ax < 0 && bx < 0) || (ax > w && bx > w) || (ay < 0 && by < 0) || (ay > h && by > h)) continue;
      var col = DOM[e.b.domain].color;
      g.beginPath();
      if (st === 2) {
        var fx = e.from === e.b ? bx : ax, fy = e.from === e.b ? by : ay, tx = e.from === e.b ? ax : bx, ty = e.from === e.b ? ay : by;
        g.moveTo(fx, fy); g.lineTo(fx + (tx - fx) * e.len, fy + (ty - fy) * e.len);
        g.strokeStyle = hexA(col, 0.42); g.lineWidth = 1; g.stroke();
      } else {
        g.setLineDash([2, 5]); g.moveTo(ax, ay); g.lineTo(bx, by);
        g.strokeStyle = hexA(col, 0.16); g.lineWidth = 1; g.stroke(); g.setLineDash([]);
      }
    }

    /* ---- travelling glints ---- */
    if (!reduced) {
      glintTimer += dt;
      if (glintTimer > 0.7) {
        glintTimer = 0;
        var full = EDGES.filter(function (e) { return e.len === 1 && edgeState(e) === 2; });
        if (glints.length < Math.min(5, full.length)) glints.push({ e: full[(Math.random() * full.length) | 0], t: 0, v: 0.22 + Math.random() * 0.16 });
      }
      for (i = glints.length - 1; i >= 0; i--) {
        var gl = glints[i]; gl.t += dt * gl.v; if (gl.t >= 1) { glints.splice(i, 1); continue; }
        var gax = (gl.e.a.sx.value - cam.x) * z + hw, gay = (gl.e.a.sy.value - cam.y) * z + hh;
        var gbx = (gl.e.b.sx.value - cam.x) * z + hw, gby = (gl.e.b.sy.value - cam.y) * z + hh;
        for (var q = 3; q >= 0; q--) {
          var tt = LAB.clamp(gl.t - q * 0.012, 0, 1), gx = gax + (gbx - gax) * tt, gy = gay + (gby - gay) * tt;
          g.fillStyle = "rgba(255,255,255," + (0.85 - q * 0.22) + ")";
          g.beginPath(); g.arc(gx, gy, q ? 0.9 : 1.6, 0, TAU); g.fill();
        }
      }
    }

    /* ---- ripples ---- */
    for (i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i], age = t - rp.t0; if (age > 0.9) { ripples.splice(i, 1); continue; }
      var rx = (rp.m.sx.value - cam.x) * z + hw, ry = (rp.m.sy.value - cam.y) * z + hh;
      g.beginPath(); g.arc(rx, ry, (6 + 3 * z) + LAB.ease.outCubic(age / 0.9) * 42, 0, TAU);
      g.strokeStyle = hexA(rp.col, (1 - age / 0.9) * 0.55); g.lineWidth = 1.5; g.stroke();
    }

    /* ---- nodes ---- */
    var base = 5 + 3 * z;
    for (i = 0; i < MODULES.length; i++) {
      m = MODULES[i];
      var sx = (m.sx.value - cam.x) * z + hw, sy = (m.sy.value - cam.y) * z + hh;
      m.scx = sx; m.scy = sy;
      if (sx < -80 || sx > w + 80 || sy < -80 || sy > h + 80) { m.vis = false; continue; }
      m.vis = true;
      st = state(m); m.st = st; col = DOM[m.domain].color;
      var r = base * (m.pop ? m.pop.value : 1); m.r = r;
      g.globalAlpha = m.a;
      if (st === "locked") {
        g.beginPath(); g.arc(sx, sy, r, 0, TAU); g.setLineDash([2, 3]);
        g.strokeStyle = "rgba(255,255,255,0.28)"; g.lineWidth = 1.2; g.stroke(); g.setLineDash([]);
      } else if (st === "frontier") {
        var br = reduced ? 0 : Math.sin(t * 1.6 + m.phase), rb = r + br * 0.8;
        g.beginPath(); g.arc(sx, sy, rb + 5 + br * 2, 0, TAU);
        g.strokeStyle = hexA(col, 0.1 + 0.08 * br); g.lineWidth = 1; g.stroke();
        drawBody(m, m.mastery, sx, sy, rb, col);
        g.beginPath(); g.arc(sx, sy, rb, 0, TAU);
        g.strokeStyle = hexA(col, (m.mastery >= 1 ? 0.85 : 0.65) + 0.15 * br); g.lineWidth = m.mastery >= 1 ? 2 : 1.6; g.stroke();
      } else {
        g.globalAlpha = m.a * (m.sweep < 1 ? m.sweep : 1);
        g.drawImage(GLOW[m.domain], sx - r * 4, sy - r * 4, r * 8, r * 8);
        g.globalAlpha = m.a;
        drawBody(m, 3, sx, sy, r, col);
        g.beginPath(); g.arc(sx, sy, r, 0, TAU);
        g.strokeStyle = "rgba(255,255,255,0.6)"; g.lineWidth = 2; g.stroke();
      }
      g.globalAlpha = 1;
    }

    /* ---- labels: outward from each cluster, higher mastery wins collisions ---- */
    g.font = FONT;
    var placed = [], zoomFade = LAB.clamp((z - 1.05) / 0.6, 0, 1), rate = Math.min(1, dt * 10);
    for (i = 0; i < order.length; i++) {
      m = order[i];
      if (!m.vis) { m.la = 0; continue; }
      var target = m.st === "locked" ? zoomFade * 0.7 : 1;
      target *= LAB.clamp((m.scy - 118) / 30, 0, 1) * LAB.clamp((h - 118 - m.scy) / 30, 0, 1);   /* fade under the strips */
      var lw = LW[m.id], ax2 = m.scx + m.dx * (m.r + 8), ay2 = m.scy + m.dy * (m.r + 8);
      var al = m.dx > 0.35 ? "left" : m.dx < -0.35 ? "right" : "center";
      var bl = m.dy > 0.35 ? "top" : m.dy < -0.35 ? "bottom" : "middle";
      var x0 = al === "left" ? ax2 : al === "right" ? ax2 - lw : ax2 - lw / 2;
      var y0 = bl === "top" ? ay2 : bl === "bottom" ? ay2 - 13 : ay2 - 6.5;
      if (al === "center") { var cx0 = LAB.clamp(x0, 6, w - lw - 6); ax2 += cx0 - x0; x0 = cx0; }
      if (target > 0.01) {
        for (var p = 0; p < placed.length; p++) {
          var pr = placed[p];
          if (x0 < pr[0] + pr[2] + 3 && x0 + lw + 3 > pr[0] && y0 < pr[1] + 13 + 2 && y0 + 15 > pr[1]) { target = 0; break; }
        }
        if (target > 0) placed.push([x0, y0, lw]);
      }
      m.la += (target - m.la) * rate;
      m.lrect = [x0, y0, lw];
      if (m.la > 0.02) {
        g.globalAlpha = m.la * m.a;
        g.fillStyle = m.st === "mastered" ? "#eef1f6" : m.st === "frontier" ? "#c3cad6" : "#7d8694";
        g.textAlign = al; g.textBaseline = bl; g.fillText(m.label, ax2, ay2);
      }
    }
    g.globalAlpha = 1;
  }
  LAB.loop(frame);

  /* ------------------------------ pointer input ------------------------------ */
  var ptr = new Map(), drag = null, pinch = null, moved = false;
  function pvals() { var a = []; ptr.forEach(function (v) { a.push(v); }); return a; }
  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId);
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    camTok++; vel.x = vel.y = 0; cv.classList.add("drag");
    DOMAINS.forEach(function (x) { x.el.classList.remove("on"); });
    var now = performance.now();
    if (ptr.size === 1) {
      dragging = true; moved = false; pinch = null;
      drag = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, lt: now, t0: now, vx: 0, vy: 0 };
    } else if (ptr.size === 2) {
      var p = pvals(), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      pinch = { d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, z0: cam.z,
                wx: cam.x + (mx - W / 2) / cam.z, wy: cam.y + (my - H / 2) / cam.z };
      moved = true;
    }
  });
  cv.addEventListener("pointermove", function (e) {
    if (!ptr.has(e.pointerId)) return;
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptr.size >= 2) {
      var p = pvals(), dd = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      var z = LAB.clamp(pinch.z0 * dd / pinch.d0, MINZ, MAXZ);
      cam.z = z; cam.x = pinch.wx - (mx - W / 2) / z; cam.y = pinch.wy - (my - H / 2) / z;
    } else if (drag && dragging) {
      var now = performance.now(), dt = Math.max(1, now - drag.lt), dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
      cam.x -= dx / cam.z; cam.y -= dy / cam.z;
      drag.vx = drag.vx * 0.4 + (dx / dt * 1000) * 0.6; drag.vy = drag.vy * 0.4 + (dy / dt * 1000) * 0.6;
      drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) moved = true;
    }
  });
  function up(e) {
    if (!ptr.has(e.pointerId)) return;
    ptr.delete(e.pointerId);
    var now = performance.now();
    if (ptr.size < 2) pinch = null;
    if (ptr.size === 1) { var r = pvals()[0]; drag = { x0: r.x, y0: r.y, lx: r.x, ly: r.y, lt: now, t0: now, vx: 0, vy: 0 }; moved = true; }
    if (ptr.size === 0) {
      dragging = false; cv.classList.remove("drag");
      if (drag && !moved && now - drag.t0 < 400) tap(e.clientX, e.clientY);
      else if (drag && now - drag.lt < 80) { vel.x = drag.vx; vel.y = drag.vy; }
      drag = null;
    }
  }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", function (e) {
    e.preventDefault(); camTok++;
    var z = LAB.clamp(cam.z * Math.exp(-e.deltaY * 0.0012), MINZ, MAXZ);
    var wx = cam.x + (e.clientX - W / 2) / cam.z, wy = cam.y + (e.clientY - H / 2) / cam.z;
    cam.z = z; cam.x = wx - (e.clientX - W / 2) / z; cam.y = wy - (e.clientY - H / 2) / z;
  }, { passive: false });

  function hit(x, y) {
    var best = null, bd = 1e9, i, m;
    for (i = 0; i < MODULES.length; i++) {
      m = MODULES[i]; if (!m.vis) continue;
      var d = Math.hypot(m.scx - x, m.scy - y);
      if (d < 26 && d < bd) { bd = d; best = m; }
    }
    if (best) return best;
    for (i = 0; i < MODULES.length; i++) {
      m = MODULES[i]; if (!m.vis || m.la < 0.5 || !m.lrect) continue;
      var lr = m.lrect;
      if (x >= lr[0] - 6 && x <= lr[0] + lr[2] + 6 && y >= lr[1] - 8 && y <= lr[1] + 21) return m;
    }
    return null;
  }
  function tap(x, y) { var m = hit(x, y); if (m) openNode(m); }

  /* ------------------------------ sheet ------------------------------ */
  function openNode(m) {
    var d = DOM[m.domain], st = state(m), esc = LAB.esc;
    var needs = m.pre.length ? m.pre.map(function (p) { var q = byId[p]; return '<span class="need' + (q.mastery >= 2 ? " ok" : "") + '">' + esc(q.label) + (q.mastery >= 2 ? " ✓" : "") + "</span>"; }).join("")
                             : '<span class="dim">nothing — start here</span>';
    var unlocks = m.next.length ? m.next.map(function (n) { return '<span class="need' + (state(n) !== "locked" ? " ok" : "") + '">' + esc(n.label) + "</span>"; }).join("")
                                : '<span class="dim">nothing further — a leaf of the map</span>';
    var missing = m.pre.filter(function (p) { return byId[p].mastery < 2; }).map(function (p) { return byId[p].label; });
    var simLabel = m.mastery >= 3 ? "Mastered" : st === "locked" ? "Locked · reach Proficient on " + esc(missing.join(", ")) : "Simulate: mark " + WORDS[m.mastery + 1].toLowerCase();
    var bars = [1, 2, 3].map(function (k) { return '<i class="' + (m.mastery >= k ? "on" : "") + '" style="--c:' + d.color + '"></i>'; }).join("");
    var html =
      '<div class="eyebrow" style="color:' + d.color + '">' + esc(d.name) + ' · exam weight <span class="mono">' + "●".repeat(m.w) + "○".repeat(3 - m.w) + "</span></div>" +
      "<h3>" + esc(m.title) + "</h3>" +
      '<div class="lvl"><div class="bar">' + bars + "</div><b>" + WORDS[m.mastery] + "</b>" + (st === "locked" ? '<span class="dim"> · locked</span>' : "") + "</div>" +
      "<p>" + esc(m.why) + "</p>" +
      '<p class="needs"><span class="k">Needs</span>' + needs + "</p>" +
      '<p class="needs"><span class="k">Unlocks</span>' + unlocks + "</p>" +
      '<div class="fact"><b>Mastery</b><span>Familiar → Proficient → Mastered. A module unlocks its neighbours at Proficient; its constellation lines light up at Mastered.</span></div>' +
      '<div class="acts"><a class="btn primary" href="../../aws/#/module/' + m.id + '">Study now</a>' +
      '<button class="btn" id="sim"' + (st === "locked" || m.mastery >= 3 ? " disabled" : "") + ">" + simLabel + "</button>" +
      '<button class="btn ghost sm" id="reset">Reset map</button></div>';
    var el = LAB.sheet(html);
    el.querySelector("#sim").onclick = function () { raise(m); };
    el.querySelector("#reset").onclick = resetMap;
  }

  /* ------------------------------ the signature moment ------------------------------ */
  function raise(m) {
    if (m.mastery >= 3 || state(m) === "locked") return;
    var wasOpen = MODULES.filter(function (x) { return state(x) !== "locked"; });
    m.mastery++; save();
    LAB.closeSheet();
    m.sweep = 0;
    LAB.tween(600, function (t) { m.sweep = t; }, LAB.ease.outCubic, function () { m.sweep = 1; });
    pulse(m);
    if (m.mastery === 3) {
      var k = 0;
      EDGES.forEach(function (e) {
        if ((e.a === m || e.b === m) && edgeState(e) === 2) {
          e.len = 0; e.from = m;
          setTimeout(function () { LAB.tween(550, function (t) { e.len = t; }, LAB.ease.outCubic); }, 250 + k * 120); k++;
        }
      });
    }
    MODULES.filter(function (x) { return state(x) !== "locked" && wasOpen.indexOf(x) < 0; }).forEach(function (x, i) {
      setTimeout(function () {
        x.pop = LAB.spring(0.35, { stiffness: 220, damping: 10 }); x.pop.set(1);
        pulse(x); LAB.haptic("pop"); LAB.sound.play("pop");
      }, 420 + i * 140);
    });
    LAB.haptic("ok"); LAB.sound.play("ok");
    refresh();
  }

  function resetMap() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    LAB.closeSheet(); load(); assemble(); refresh();
    DOMAINS.forEach(function (x) { x.el.classList.remove("on"); });
    LAB.haptic("tap"); LAB.sound.play("whoosh");
  }

  /* ------------------------------ DOM: rings, bottom strip ------------------------------ */
  var strip = LAB.h('<div class="rings" role="group" aria-label="Exam domains"></div>');
  DOMAINS.forEach(function (d) {
    var b = LAB.h('<button class="ring" aria-label="' + d.name + '"><span class="ico"><svg viewBox="0 0 40 40" aria-hidden="true">' +
      '<circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16" style="stroke:' + d.color + '"/></svg>' +
      '<span class="n"></span></span><span class="lbl">' + d.short + "</span></button>");
    b.onclick = function () { flyToCluster(d); };
    d.el = b; strip.appendChild(b);
  });
  document.body.appendChild(strip);

  var bottom = LAB.h('<div class="bottom">' +
    '<div class="legend"><span><i class="m"></i>Mastered</span><span><i class="p"></i>Proficient</span><span><i class="f"></i>Familiar</span><span><i class="l"></i>Locked</span></div>' +
    '<div class="pillrow"><button class="pill" id="next"><span class="dot"></span><span><span class="k">Next for you</span><b></b></span>' +
    '<svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>' +
    '<button class="btn ghost sm reset" id="resetb">Reset map</button></div></div>');
  document.body.appendChild(bottom);
  var pill = bottom.querySelector("#next"), pillB = pill.querySelector("b"), nextNode = null;
  pill.onclick = function () { if (nextNode) flyToNode(nextNode); };
  bottom.querySelector("#resetb").onclick = resetMap;

  function refresh() {
    var CIRC = 2 * Math.PI * 16;
    DOMAINS.forEach(function (d) {
      var ms = MODULES.filter(function (m) { return m.domain === d.id; });
      var sum = 0, done = 0; ms.forEach(function (m) { sum += m.mastery; if (m.mastery >= 3) done++; });
      var pct = sum / (3 * ms.length);
      var fg = d.el.querySelector(".fg");
      fg.style.strokeDasharray = CIRC; fg.style.strokeDashoffset = CIRC * (1 - pct);
      d.el.querySelector(".n").textContent = done + "/" + ms.length;
    });
    nextNode = bestNext();
    if (nextNode) { pillB.textContent = nextNode.label; pill.style.setProperty("--c", DOM[nextNode.domain].color); pill.querySelector(".k").textContent = "Next for you"; }
    else { pillB.textContent = "Every module mastered"; pill.querySelector(".k").textContent = "Map complete"; }
    var rank = { mastered: 3, frontier: 2, locked: 1 };
    order = MODULES.slice().sort(function (a, b) { return (rank[state(b)] - rank[state(a)]) || (b.mastery - a.mastery) || (b.w - a.w); });
  }

  /* ------------------------------ go ------------------------------ */
  load(); assemble(); refresh();
  window.CONSTELLATION = { nodes: MODULES, cam: cam, open: openNode, raise: raise, next: function () { return nextNode; } };
})();
</script>
</body>
</html>
